  "dialogues": {
    "jordan": [
      [
        "Jordan",
        "Le relais ne répond plus. Vérifiez les auxiliaires avant de rappeler la mine."
      ],
      [
        "Hoop",
        "Je passe par les commandes locales."
      ]
    ],
    "baxter": [
      [
        "Baxter",
        "Le silence est trop propre. Même la porteuse a disparu."
      ],
      [
        "Hoop",
        "Gardez la dernière réception. Ne relancez rien sur le réseau."
      ]
    ],
    "welford": [
      [
        "Welford",
        "J’ai trié ce qui tient encore la pression. Le reste, je n’y touche plus."
      ]
    ],
    "powell": [
      [
        "Powell",
        "Il y a un retour de courant dans la galerie auxiliaire. Coupez-le à la vanne, pas depuis le pupitre."
      ]
    ],
    "kasyanov": [
      [
        "Kasyanov",
        "Je garde la commande de l’unité ici. Si le pupitre vous demande autre chose, prévenez-moi."
      ]
    ],
    "garcia": [
      [
        "Garcia",
        "Les trousses sont prêtes. Je préférerais les remettre dans l’armoire."
      ]
    ],
    "sneddon": [
      [
        "Sneddon",
        "Nous avançons parce que rester ici ne nous protège pas. Regardez derrière, pas seulement devant."
      ]
    ],
    "lachance": [
      [
        "Lachance",
        "Je peux piloter sans leur assistance. J’ai besoin des attaches, du courant et d’un signal clair."
      ]
    ],
    "hoop": [
      [
        "Hoop",
        "On garde une sortie. Même si elle nous oblige à revenir sur nos pas."
      ]
    ],
    "ripley": [
      [
        "Ripley",
        "Ne comptez pas sur le bruit pour savoir où elle est. Comptez les sorties."
      ]
    ]
  },
  "storyEvents": [
    {
      "at": 3,
      "id": "local",
      "speaker": "Baxter",
      "text": "Le relais tient. Il n’y a toujours personne au bout de la ligne.",
      "effect": "relay"
    },
    {
      "at": 5,
      "id": "impact",
      "speaker": "Hoop",
      "text": "La Delilah a frappé. La passerelle ne répond plus. Jordan ne répond plus.",
      "lost": [
        "jordan"
      ],
      "effect": "impact"
    },
    {
      "at": 9,
      "id": "wake",
      "speaker": "Ripley",
      "text": "Avant de repartir, montrez-moi tous les accès de cette navette.",
      "effect": "wake"
    },
    {
      "at": 14,
      "id": "garcia",
      "speaker": "Kasyanov",
      "text": "Welford et Powell ne répondent plus dans le vestibule. Garcia manque elle aussi à l’appel. Repliez-vous.",
      "lost": [
        "garcia",
        "welford",
        "powell"
      ],
      "effect": "seal"
    },
    {
      "at": 20,
      "id": "lift",
      "speaker": "Hoop",
      "text": "Cette cage ne remontera pas. Le second puits est notre seule sortie.",
      "effect": "lift"
    },
    {
      "at": 27,
      "id": "bones",
      "speaker": "Ripley",
      "text": "Ces restes n’étaient pas humains. Nous devons quitter cette chambre.",
      "effect": "reveal"
    },
    {
      "at": 30,
      "id": "wounded",
      "speaker": "Hoop",
      "text": "Kasyanov a le bras touché. Sneddon ne tient plus debout. On remonte ensemble.",
      "injured": [
        "kasyanov",
        "ripley",
        "baxter"
      ],
      "effect": "wounded"
    },
    {
      "at": 31,
      "id": "baxter",
      "speaker": "Hoop",
      "text": "Baxter ! ... La cage continue de monter. Il n’est plus avec nous.",
      "lost": [
        "baxter"
      ],
      "effect": "lift"
    },
    {
      "at": 37,
      "id": "lachance",
      "speaker": "Hoop",
      "text": "Lachance vient de tomber. La présence nous a suivis jusqu’au quai.",
      "lost": [
        "lachance"
      ],
      "effect": "impact"
    },
    {
      "at": 39,
      "id": "sneddon",
      "speaker": "Hoop",
      "text": "Sneddon a condamné la soute de l’intérieur. Après l’éclair, plus aucun mouvement.",
      "lost": [
        "sneddon"
      ],
      "effect": "blast"
    },
    {
      "at": 41,
      "id": "consent",
      "speaker": "Ripley",
      "text": "Faites cesser ces images. Je ne veux plus revoir cet endroit.",
      "effect": "medpod"
    },
    {
      "at": 42,
      "id": "medpod",
      "speaker": "Hoop",
      "text": "La commande vient de changer toute seule. Kasyanov ne répond plus. Je ramène Ripley au Narcissus.",
      "lost": [
        "kasyanov"
      ],
      "effect": "medpod"
    },
    {
      "at": 44,
      "id": "ash",
      "speaker": "Hoop",
      "text": "La copie a disparu. Mais les attaches automatiques sont mortes avec elle. Je dois revenir au quai.",
      "effect": "purge"
    },
    {
      "at": 46,
      "id": "goodbye",
      "speaker": "Hoop",
      "text": "Le collier est ouvert. Le Narcissus s’éloigne.",
      "effect": "release"
    }

/** V0.5 — Local acoustics, bounded evidence and decoy memory.
 * Sound may cross one authored adjacency. It never spawns an enemy or searches

const SOUND_KINDS=['steps','torch','machine','decoy','cart'];

 if(kind!=='decoy'&&list.some(v=>v.kind===kind&&Math.hypot(v.x-x,v.y-y)<65))return false;
 list.push({kind,x:clamp(x,28,r.width-28),y:r.mode==='profile'?88:clamp(y,0,180),at:s.elapsed});
 if(list.length>DATA.acoustics.maxResiduesPerRoom)list.shift();s.dirty=true;return true;
}
function emitSound(s,kind,x,y,volume=1,room=s.room){
 if(!ROOM[room]||!SOUND_KINDS.includes(kind)||s.dead||s.finished)return null;
 const cue={id:++s.soundSeq,kind,room,x:clamp(x,30,ROOM[room].width-30),y:ROOM[room].mode==='profile'?88:clamp(y,0,180),volume:clamp(volume,.1,1),ttl:2.1};

 // The log contains only one's own emitted sounds, never a hidden enemy roster.

 if(!last||last.kind!==kind||last.room!==room||s.elapsed-last.at>4){s.soundLog.push({kind,room,at:s.elapsed});s.soundLog=s.soundLog.slice(-16);}
 if(s.chapter<6||s.chapter>10)return cue;
 for(const portal of ROOM[room].portals){
  if(!DATA.acoustics.edges.includes(portal.edge)||!pursuitAllowed(s,portal.edge)||DATA.pursuitRules.safeRooms.includes(room)||doorStatus(s,portal.edge).sealed)continue;
  const origin=portal.target,back=ROOM[origin].portals.find(p=>p.edge===portal.edge),world=s.world[origin];
  if(!world||!back)continue; // Never instantiate a distant room to populate it.
  const toDoor=Math.hypot(cue.x-portal.x,(cue.y-portal.y)*1.4);
  for(const e of world.enemies){

// V0.6 — optional maintenance. The mandatory route never spends these parts.
function maintenanceStatus(s,id){
 const job=DATA.maintenance.repairs.find(j=>j.id===id);
 if(!job)return {exists:false,done:false,stage:0,label:'Accès inconnu'};
 const stage=Math.floor(clamp(s.maintenance?.repairs?.[id],0,3));
 return {exists:true,id,edge:job.edge,stage,done:stage===3,label:stage===3?'PASSAGE RÉTABLI':job.stages[stage].label,
  cost:stage===3?0:job.stages[stage].cost,hold:stage===3?0:job.stages[stage].hold,available:s.chapter>=job.minChapter};
}
function observeMaintenance(s){
 const m=s.maintenance,r=ROOM[s.room],p=s.player;if(!m)return;
 for(const a of DATA.interactables.filter(a=>a.room===s.room))if(Math.hypot(a.x-p.x,(a.y-p.y)*1.2)<210&&!m.observed.includes(a.id))m.observed.push(a.id);
 for(const po of r.portals){const j=DATA.maintenance.repairs.find(j=>j.edge===po.edge);if(j&&s.chapter>=j.minChapter&&Math.hypot(po.x-p.x,(po.y-p.y)*1.2)<210&&!m.seen.includes(j.id))m.seen.push(j.id);}

function stepMaintenance(s,input,dt,moving,hpBefore){

 const job=po&&DATA.maintenance.repairs.find(j=>j.edge===po.edge),status=job&&maintenanceStatus(s,job.id);
 const reset=()=>{s.maintenanceHold=0;s.maintenanceTarget=null;};
 if(job&&status.done&&input.interact&&s.maintenancePressDone){reset();return true;}
 if(!job||status.done||!input.interact){reset();return false;}
 if(s.maintenancePressDone){reset();return true;}
 if(moving||input.bulkhead||input.fire||input.decoy||input.listen||input.heal||s.dead||s.player.hp<hpBefore||s.flags.carryRipley||s.flags.cellCarried){reset();return true;}
 if(!status.available){notice(s,'La desserte reste isolée pour le moment.');reset();s.maintenancePressDone=true;return true;}
 if(s.maintenance.parts<status.cost){notice(s,`${status.cost} pièces nécessaires ; ${s.maintenance.parts} en réserve. Le chemin principal reste ouvert.`,5);reset();s.maintenancePressDone=true;return true;}
 if(s.portalCooldown>0){reset();return true;}
 s.player.hidden=null;
 if(s.maintenanceTarget!==job.id){reset();s.maintenanceTarget=job.id;}
 s.maintenanceHold+=dt;s.noise=Math.max(s.noise,.7);
 if(s.maintenanceNoise<=0){emitSound(s,'machine',po.x,po.y,.72);s.maintenanceNoise=1.2;}
 if(s.maintenanceHold+1e-8>=status.hold){
  // Atomic commit: recheck before deducting; the next stage requires a fresh press.
  if(s.maintenance.parts<status.cost){reset();return true;}
  s.maintenance.parts-=status.cost;s.maintenance.repairs[job.id]=status.stage+1;s.dirty=true;s.maintenancePressDone=true;reset();
  const after=maintenanceStatus(s,job.id);
  if(after.done){notice(s,job.title+' : passage remis en service.',6);s.journal.push({chapter:s.chapter,text:'Maintenance facultative — '+job.title+' rétablie.'});s.portalCooldown=.8;}
  else notice(s,`Étape ${after.stage}/3 enregistrée. Relâchez E, puis ${after.label.toLowerCase()}.`,5);
 }
 return true;
}
function useMaintenanceActivity(s,a){

/** V0.7 optional water circuit. All durations are simulation time; no real-world timers.

}

function validateMemoryBundle(raw){

/** V0.9 — bounded manual handling.
 * Geometry is derived per state, never written into ROOM or DATA. Every move

 * Navigation caches use geometry object identity and cannot leak across saves.

const geometryCache = new WeakMap();
function cartPosition(s,id){const def=DATA.handling.carts.find(c=>c.id===id);return def?(s.handling?.positions?.[id]||{x:def.x,y:def.y}):null;}

}

function observeHandling(s){

}
function nearestCart(s){

}
function releaseCart(s,reason=''){
 if(!s.handling?.grip)return false;s.handling.grip=null;s.gripMoved=false;s.dirty=true;if(reason)notice(s,reason,2.6);else if(s.notice?.startsWith('Poignées en main.'))notice(s,'Freins serrés. Le matériel reste ici.',2.6);return true;
}
function gripCart(s){
 if(s.dead||s.finished||s.puzzle||s.reading||s.player.hidden||s.player.crouch||s.flags.carryRipley||s.flags.cellCarried||s.excursion.recorder?.carried){notice(s,'Il faut être debout, les deux mains libres.');return false;}

}
function boxOverlap(a,b,pad=0){return a.x+a.w+pad>b.x&&a.x-pad<b.x+b.w&&a.y+a.h+pad>b.y&&a.y-pad<b.y+b.h;}

function stepCart(s,input,dt){

function restoreHandling(s,v){

/** Interactive foreground objects fade on projected overlap, not only generic props. */
function occlusionAlpha(s,kind,obj){
 if(!['prop','activity','goal'].includes(kind)||obj.y<=s.player.y)return 1;
 if(kind==='activity'&&obj.kind==='hide'&&s.player.hidden===obj.id)return 1;
 const widths={light:54,machine:82,hide:68,cache:43,archive:20,valve:32};
 const width=kind==='prop'?(PROP[obj.type]?.width||50):kind==='activity'?(widths[obj.kind]||54):90;
 if(Math.abs(obj.x-s.player.x)>width*.6+18)return 1;
 if((obj.y-s.player.y)*.91>125)return 1;
 return .3;
}

 function exportMemories(){
  save();try{
   const campaign=session==='campaign'?serialize(state):localStorage.getItem(DATA.saveKey),replay=session==='replay'?serialize(state):localStorage.getItem(DATA.saveKey+':replay-v8');
   const payload=validateMemoryBundle(JSON.stringify({format:'atf-marion-memories',schema:1,campaign,replay:restore(replay)?replay:null,entries:chapterEntries().filter(Boolean)}));
   if(!payload)throw new Error('Le carnet principal n’est pas disponible.');
   const blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='MEMOIRES_MARION_V08.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){archiveWarning='Export des mémoires indisponible : '+e.message;chronicle();}
 }
 async function prepareMemories(file){
  if(!file)return;memoryImportCandidate=null;
  try{if(file.size>5000000)throw new Error('Paquet trop volumineux.');const b=validateMemoryBundle(await file.text());if(!b)throw new Error('Le paquet ne respecte pas le format des mémoires.');memoryImportCandidate=b;
   show('chronicle',`<p>Ce paquet contient une campagne, ${b.entries.length} entrées de chapitre et ${b.replay?'une répétition':'aucune répétition'}.</p><p class="replay-warning">La confirmation remplacera les mémoires locales de ce DLC. Les autres campagnes et DLC ne sont pas modifiés.</p><div class="button-row"><button data-panel="chronicle">Annuler</button><button class="primary" data-action="apply-memories">Remplacer les mémoires locales</button></div>`,'IMPORT À CONFIRMER');
  }catch(e){archiveWarning='Import refusé : '+e.message;chronicle();}
 }
 function applyMemories(){
  const b=memoryImportCandidate;if(!b)return false;
  const writes=new Map([[DATA.saveKey,b.campaign],[DATA.saveKey+':replay-v8',b.replay],[DATA.saveKey+':checkpoint-v2',b.campaign],[DATA.saveKey+':replay-checkpoint-v8',b.replay]]);
  for(let i=0;i<DATA.chapters.length;i++){const e=b.entries.find(q=>q.chapter===i);writes.set(chapterSlot(i),e?JSON.stringify(e):null);}
  const prior=new Map();try{
   for(const k of writes.keys())prior.set(k,localStorage.getItem(k));
   for(const [k,v] of writes){if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}
  }catch(e){
   let rollback=true;for(const k of prior.keys()){try{localStorage.removeItem(k);}catch{rollback=false;}}
   for(const [k,v] of prior){if(v!==null)try{localStorage.setItem(k,v);}catch{rollback=false;}}
   archiveWarning='Écriture interrompue. '+(rollback?'Les anciennes mémoires ont été remises en place.':'La restauration locale a aussi échoué ; conservez votre export.');chronicle();return false;
  }
  session='campaign';replayOrigin=-1;attemptedEntries.clear();archiveWarning='';memoryImportCandidate=null;changeState(restore(b.campaign));save();begin();return true;
 }

iv class="sequence-library">${DATA.sequences.map((q,i)=>{const unlocked=q.at<=state.completed.length;return `<button class="sequence-card" data-sequence="${q.id}" ${unlocked?'':'disabled'}><span>${String(i+1).padStart(2,'0')}</span><strong>${unlocked?esc(q.title):'Séquence non découverte'}</strong><small>${unlocked?'3 TABLEAUX · REVOIR':'VERROUILLÉE'}</small></button>`;}).join('')}</div><p class="hint">Les séquences sont des mises en scène originales avec le rendu du jeu. Elles n’attribuent ni ressources ni objectifs. Entrée / espace : tableau suivant. Échap : retour immédiat. Aucune voix officielle.</p><div class="button-row"><button data-close class="primary">Fermer le carnet</button></div>`,'MÉMOIRES LOCALES / SESSIONS SÉPARÉES');
