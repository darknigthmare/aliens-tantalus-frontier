m":"R70","to":"R16","door":"R70>R16","requires":["AE-14"],"shortcut":false}],"characters":[{"id":"wendy","name":"Wendy","type":"Hybride","role":"Corps synthétique, conscience humaine. Déplacement rapide, poussée de dégagement et résonance après l’accord acoustique.","canon":"Première hybride réussie de Prodigy ; sœur de Joe.","weapon":"none","speed":225,"health":120,"source":"FX_CHARACTERS"},{"id":"joe","name":"Joe Hermit","type":"Humain","role":"Secours et reconnaissance. Arme de sécurité à ressources limitées ; vulnérable aux organismes qui ciblent les humains.","canon":"Frère de Wendy, engagé dans les secours à New Siam.","weapon":"security","speed":198,"health":100,"source":"FX_CHARACTERS","weaponName":"MCS-X · adaptation du fusil Prodigy"},{"id":"morrow","name":"Morrow","type":"Cyborg","role":"Sécurité du Maginot. Arme de sécurité et résistance accrue, uniquement dans le retour en arrière.","canon":"Chef de la sécurité du Maginot, lié à Weyland-Yutani.","weapon":"security","speed":190,"health":135,"source":"FX_MORROW","weaponName":"Pistolet de bord WY · modèle non certifié"}],"creatures":[{"id":"xeno_maginot","name":"Xénomorphe du Maginot","canon":"Individu du vaisseau, distinct de celui développé à Neverland.","behavior":"Patrouille, enquête sur le bruit, mémorise une dernière position, s’aligne en profondeur, prépare une charge. Un tir le repousse ; il ne devient pas du butin.","counter":"Rompre la ligne de vue, rester discret, profiter de son engagement annoncé. La résonance de Wendy ne le commande pas.","source":"WETA_INTERVIEW","status":"CANON + COMPORTEMENT LUDIQUE ADAPTÉ"},{"id":"xeno_neverland","name":"Xénomorphe de Neverland","canon":"Individu développé en cuve, lié à la communication de Wendy.","behavior":"L’approche reste dangereuse. Une résonance obtenue au chapitre 4 interrompt temporairement son comportement ; ce n’est pas une laisse permanente.","counter":"Résonance de Wendy, interposition architecturale, déplacement prudent.","source":"WETA_INTE  et attend près des accès. Le changement d’hôte lui-même est un événement narratif, pas une simulation complète.","counter":"Maintenir la distance et couper les lignes de vue. Ne pas interpréter sa présence comme celle d’un allié.","source":"EP08","status":"CANON + HÔTE SIMPLIFIÉ"},{"id":"orchid","name":"Orchidée · D. Plumbicare","canon":"Créature carnivore suspendue, conçue parmi les organismes du Maginot.","behavior":"Reste fixée au plafond ou à une branche. Une ombre se resserre avant l’abattement ; l’attaque ne traverse pas toute la pièce.","counter":"Lire la zone au sol, attendre la fin de l’attaque ou contourner en profondeur.","source":"WETA_CREATURES","status":"CANON + EMBUSCADE ADAPTÉE"}],"sources":[{"id":"FX_OVERVIEW","title":"FX — Alien: Earth","url":"https://www.fxnetworks.com/shows/alien-earth","scope":"Cadre officiel et présentation de la série.","type":"primaire","checked":"2026-09-29"},{"id":"FX_CHARACTERS","title":"FX — personnages","url":"https://www.fxnetworks.com/shows/alien-earth/characters","scope":"Rôles des personnages ; Wendy, Joe, Kirsh, Boy Kavalier, les hybrides.","type":"primaire","checked":"2026-09-29"},{"id":"FX_MORROW","title":"FX — Morrow","url":"https://www.fxnetworks.com/shows/alien-earth/characters/babou-ceesay-morrow","scope":"Rôle de Morrow et rattachement au Maginot.","type":"primaire","checked":"2026-09-29"},{"id":"WETA_PROJECT","title":"Wētā Workshop — Alien: Earth","url":"https://www.wetaworkshop.com/projects/alien-earth","scope":"Production, année 2120, Maginot, direction artistique des créatures.","type":"primaire","checked":"2026-09-29"},{"id":"WETA_CREATURES","title":"Wētā Workshop Design Studio — Maginot Creatures","url":"https://wetaworkshopdesignstudio.artstation.com/projects/5WQqmz","scope":"Quatre nouveaux organismes : Eye, Tick, Fly, Orchid.","type":"primaire","checked":"2026-09-29"},{"id":"WETA_INTERVIEW","title":"Entretien avec les créateurs de Wētā","url":"https://winteriscoming.net/how-weta-workshop-reimagined-xenomorph-alien-earth-creatures","scope":"Xénomorphes distincts et fonctions biologiques des organismes. 26 septembre 2025.","type":"entretien primaire","checked":"2026-09-29"},{"id":"EP02","title":"Repères narratifs — Mr. October","url":"https://en.wikipedia.org/wiki/Alien:_Earth#Episodes","scope":"Tour de New Siam et situation de Joe. Vérification secondaire, pas transcription.","type":"secondaire","checked":"2026-09-29"},{"id":"EP03","title":"Repères narratifs — Metamorphosis","url":"https://en.wikipedia.org/wiki/Alien:_Earth#Episodes","scope":"Récupération de Joe et transfert.","type":"secondaire","checked":"2026-09-29"},{"id":"EP04","title":"Repères narratifs — Observation","url":"https://en.wikipedia.org/wiki/Alien:_Earth#Episodes","scope":"Acoustique de Wendy et vivarium.","type":"secondaire","checked":"2026-09-29"},{"id":"EP05","title":"Repères narratifs — In Space, No One…","url":"https://en.wikipedia.org/wiki/Alien:_Earth#Episodes","scope":"Retour en arrière à bord du Maginot.","type":"secondaire","checked":"2026-09-29"},{"id":"EP06","title":"Repères narratifs — The Fly","url":"https://en.wikipedia.org/wiki/Alien:_Earth#Episodes","scope":"Nibs, Isaac et Arthur.","type":"secondaire","checked":"2026-09-29"},{"id":"EP07","title":"Repères narratifs — Emergence","url":"https://en.wikipedia.org/wiki/Alien:_Earth#Episodes","scope":"Conséquences de l’infection d’Arthur.","type":"secondaire","checked":"2026-09-29"},{"id":"EP08","title":"Repères narratifs — The Real Monsters","url":"https://en.wikipedia.org/wiki/Alien:_Earth#Episodes","scope":"Final ouvert, renversement de la captivité.","type":"secondaire","checked":"2026-09-29"},{"id":"FX_CAST","title":"FX — personnages et photographies officielles","url":"https://www.fxnetworks.com/shows/alien-earth/characters","note":"Noms, rôles, silhouette et tenues des photos de référence ; pas toutes les variantes de scène."},{"id":"FX_PRODUCTION","title":"FX — production design","url":"https://www.fxnetworks.com/shows/alien-earth/production-design","note":"Direction artistique et éléments de décor ; aucun plan intégral métrique obtenu."},{"id":"FX_PLACES","title":"FX — lieux","url":"https://www.fxnetworks.com/shows/alien-earth/locations","note":"Neverland et ses paysages ; raccords intérieurs non certifiés."},{"id":"COSTUMES","title":"Entretien avec Suttirat Anne Larlarb, costumière","url":"https://www.motionpictures.org/2025/09/costume-designer-suttirat-anne-larlarb-on-dressing-scorching-corporate-controlled-future-in-alien-earth/","note":"Wendy bras nus, silhouettes hybrides, Kirsh et palette des tenues."},{"id":"FX_ARMORY","title":"FX — armurerie","url":"https://www.fxnetworks.com/shows/alien-earth/armory","note":"Page de référence officielle. Son inventaire interactif complet n’a pas été extrait."},{"id":"ARMORER","title":"AVPGalaxy — présentation du dossier FX et de l’armurier","url":"https://www.avpgalaxy.net/2025/08/21/inside-alien-earth-new-fx-website-feature-includes-behind-the-scenes-weaponry-and-world-info/","note":"MCS-X, désignation et silhouette ; relais du dossier officiel."},{"id":"MAGINOT_PD","title":"Entretien Andy Nicholson — intérieur du Maginot","url":"https://www.gamesradar.com/entertainment/horror-shows/alien-earth-production-designer-on-creating-the-nostromo-mirroring-maginot-there-was-definitely-a-certain-amount-of-geeking-out/","note":"Réfectoire et salle de communication MU/TH/UR ; pas leur connectivité exacte."},{"id":"ZOO_ART","title":"Ruben Alba — The Zoo, concept de production","url":"https://rubenalba.artstation.com/projects/bgqYoo","note":"Laboratoire de transport des spécimens."},{"id":"EP03_REF","title":"Résumé épisode 3 — Metamorphosis","url":"https://www.avpgalaxy.net/tv/alien-earth/episodes/season-1/metamorphosis/","note":"Joe dans le conteneur du quai, lame de massicot et crochet ; source secondaire, pas relevé image par image."},{"id":"EP05_REF","title":"Résumé épisode 5 — In Space, No One…","url":"https://www.avpgalaxy.net/tv/alien-earth/episodes/season-1/in-space-no-one/","note":"Passerelle, réfectoire et espaces du Maginot."},{"id":"DORM_REF","title":"Photographies de tournage — dortoir des hybrides","url":"https://www.avpgalaxy.net/tv/alien-earth/gallery/behind/","note":"Existence du dortoir ; disposition adaptée."},{"id":"KSG_REF","title":"KSG-AL — inventaire secondaire renvoyant au dossier FX","url":"https://alienanthology.fandom.com/wiki/KSG-AL","note":"Arc et mousse ; appellation à recouper directement dans le dossier armurier avant certification."},{"id":"LATIMES_SETS","title":"Los Angeles Times — production design Alien: Earth","url":"https://www.latimes.com/entertainment-arts/tv/story/2025-09-09/alien-earth-production-design","note":"Maginot : réfectoire presque identique, passerelle proche, MU/TH/UR agrandie, cryostase étendue ; Zoo, réfectoire et engineering construits avec corridors interconnectés. Ne fournit pas un plan métrique complet."},{"id":"FX_IMMERSIVE","title":"FX — Alien: Earth immersive experience","url":"https://www.fxnetworks.com/shows/alien-earth/immersive","note":"Références spatiales/personnages et chambre de confinement du Maginot ; pas un blueprint exhaustif."},{"id":"FX_INSIDE","title":"FX — Inside Alien: Earth","url":"https://www.fxnetworks.com/shows/alien-earth/inside-alien-earth","note":"Accès aux dossiers production design, costumes et armurerie ainsi qu’au set tour."},{"id":"ASC_MAGINOT","title":"American Cinematographer — building the Maginot","url":"https://theasc.com/articles/alien-earth-the-uscss-maginot","note":"Structures familières : cryogénie en pétales, coursives d’ingénierie, réfectoire hexagonal."},{"id":"EP05_SPACES","title":"AVPGalaxy — Episode 5 In Space, No One…","url":"https://www.avpgalaxy.net/tv/alien-earth/episodes/season-1/in-space-no-one/","note":"Medbay One, engineering bay, engine room, passerelle et équipage du Maginot ; source secondaire de continuité, pas plan exact."},{"id":"FX_SETTOUR","title":"FX / set tour — Neverland interiors","url":"https://www.dailymotion.com/video/x9qzt7c","note":"Set tour : espaces domestiques, medical bay, lobby, atrium, talking room et secure lab/egg room. Disposition de jeu reconstituée."},{"id":"IMFDB_WEAPONS","title":"IMFDB — Alien: Earth","url":"https://www.imfdb.org/wiki/Alien:_Earth","note":"Identification visuelle secondaire : MCS-X sur Steyr AUG, sidearm Prodigy sur Maxim 9 modifié, pistolets Glock/P80 modifiés sur le Maginot."},{"id":"HOOKBARREL_WEAPONS","title":"Hook & Barrel — firearms of Alien: Earth","url":"https://www.hookandbarrel.com/entertainment/alien-earth-guns/","note":"Références secondaires : Maxim 9, KRISS Vector et plateformes de confinement. À recouper image par image avant certification totale."}],"rules":[{"id":"LD-001","category":"Continuité","text":"L’année de référence est 2120. Ne pas importer l’arsenal ou une campagne de Marines de 2179 comme équipement standard."},{"id":"LD-002","category":"Continuité","text":"Le Maginot, New Siam et Neverland sont des lieux distincts. Les transferts entre eux sont explicitement annoncés."},{"id":"LD-003","category":"Continuité","text":"Le chapitre Maginot est un retour en arrière, sans duplication de cargaison dans le présent."},{"id":"LD-004","category":"Continuité","text":"Les morts établies dans le récit restent des conséquences, pas des objectifs de réanimation."},{"id":"LD-005","category":"Continuité","text":"Les plans exacts de la série ne sont pas revendiqués : chaque plan de ce module est une adaptation jouable."},{"id":"LD-006","category":"Continuité","text":"Les dialogues sont originaux. Aucune réplique étendue ni bande sonore de la série n’est distribuée."},{"id":"LD-007","category":"Continuité","text":"Le Xénomorphe du Maginot et celui de Neverland ont des identifiants différents."},{"id":"LD-008","category":"Continuité","text":"L’Œil, la Tique, la Mouche et l’Orchidée ne sont pas rangés dans les castes xénomorphes."},{"id":"LD-009","category":"Continuité","text":"La résonance n’est accessible à Wendy qu’après l’accord des capteurs, et n’affecte pas tous les organismes."},{"id":"LD-010","category":"Continuité","text":"La campagne s’arrête à la fin de la saison 1. Aucun contenu inédit de saison 2 n’est présenté comme officiel."},{"id":"LD-011","category":"Espace","text":"SIDE conserve une bande praticable. Les obstacles n’obligent pas à traverser un mur pour avancer."},{"id":"LD-012","category":"Espace","text":"DEPTH autorise un contournement physique réel, pas seulement une variation de taille des sprites."},{"id":"LD-013","category":"Espace","text":"HYBRID conserve une circulation compacte autour de portes et d’îlots lisibles."},{"id":"LD-014","category":"Espace","text":"SETPIECE contraint l’espace aux besoins du transfert ou du verrouillage, sans véhicule libre fictif."},{"id":"LD-015","category":"Espace","text":"Une porte intérieure possède un retour identifié et un point d’arrivée hors de son seuil."},{"id":"LD-016","category":"Espace","text":"Les liaisons entre étages portent une désignation de monte-charge, d’escalier ou de passerelle."},{"id":"LD-017","category":"Espace","text":"Une mission se débloque par des actions sur place, pas en ouvrant son entrée dans le codex."},{"id":"LD-018","category":"Espace","text":"Les meubles de premier plan ont un pied et un volume ; leur collision n’occupe pas toute leur image."},{"id":"LD-019","category":"Espace","text":"Un objectif, une archive ou un point d’arrivée ne peut pas se trouver dans un volume solide."},{"id":"LD-020","category":"Espace","text":"Le chemin vers chaque interaction doit être vérifié par une recherche de trajet sur la géométrie livrée."},{"id":"LD-021","category":"Espace","text":"Les passerelles et seuils sont lisibles ; aucun changement de profondeur n’est dissimulé derrière un faux mur."},{"id":"LD-022","category":"Espace","text":"Le mode classique utilise des plans et des passages identifiés ; il ne modifie pas la progression."},{"id":"LD-023","category":"Espace","text":"Le retour par une porte n’achève ni objectif ni chapitre automatiquement."},{"id":"LD-024","category":"Espace","text":"Les accès de chapitre vérifient les quatre actions du chapitre avant transfert."},{"id":"LD-025","category":"Rendu","text":"Le décor couvre l’ensemble du champ de jeu depuis son bord haut. Aucun fond limité à une bande inférieure."},{"id":"LD-026","category":"Rendu","text":"La parallaxe sépare ciel ou baie lointaine, architecture, plan jouable et avant-plan."},{"id":"LD-027","category":"Rendu","text":"Les humains, organismes et objets de volume sont triés par leur profondeur au sol."},{"id":"LD-028","category":"Rendu","text":"Un premier plan qui masque le personnage devient translucide, sans changer sa collision."},{"id":"LD-029","category":"Rendu","text":"Le HUD est placé hors du champ de déplacement ; le codex et la carte interrompent le temps."},{"id":"LD-030","category":"Rendu","text":"Les accessoires des laboratoires, du Maginot, de la tour et de la jungle suivent des familles distinctes."},{"id":"LD-031","category":"Rendu","text":"La signalétique sert les portes et objectifs. Pas de commentaires de programmation dans le monde."},{"id":"LD-032","category":"Rendu","text":"Les sprites de cette version sont des dessins vectoriels procéduraux. Ne pas les qualifier de photoréalistes ou 1:1."},{"id":"LD-033","category":"IA","text":"Les dégâts au contact exigent une proximité en X et en profondeur."},{"id":"LD-034","category":"IA","text":"La perception n’utilise pas la position du joueur à travers une collision opaque."},{"id":"LD-035","category":"IA","text":"Un bruit peut être entendu sans ligne de vue ; l’enquête suit alors une dernière position connue."},{"id":"LD-036","category":"IA","text":"Les acteurs mobiles utilisent les mêmes empreintes d’obstacles que le joueur."},{"id":"LD-037","category":"IA","text":"Une attaque dangereuse est annoncée avant de devenir active."},{"id":"LD-038","category":"IA","text":"La corrosion possède une durée finie et ne devient pas un obstacle invisible permanent."},{"id":"LD-039","category":"IA","text":"Les tirs prennent en compte l’alignement de profondeur et l’occlusion par des objets solides."},{"id":"LD-040","category":"IA","text":"Les outils repoussent les créatures principales sans distribuer de butin ni contredire leur survie canonique."},{"id":"LD-041","category":"IA","text":"Le Facehugger n’implante pas Wendy dans cette adaptation ; les dégâts d’implantation sont abstraits pour les humains."},{"id":"LD-042","category":"IA","text":"L’Œil enfermé ne traverse pas le verre et n’inflige pas de dégâts au joueur."},{"id":"LD-043","category":"Sauvegarde","text":"La sauvegarde du DLC reste dans un espace de stockage distinct de la campagne stratégique Tantalus."},{"id":"LD-044","category":"Sauvegarde","text":"Une reprise ne restaure jamais une touche enfoncée, un verrou de transition ou un mélange de caméra."},{"id":"LD-045","category":"Sauvegarde","text":"Une sauvegarde invalide est signalée sans écraser silencieusement les données originales."},{"id":"LD-046","category":"Sauvegarde","text":"Une mort propose la reprise au point d’entrée de la pièce ; elle n’efface pas les archives déjà enregistrées."},{"id":"LD-047","category":"Sauvegarde","text":"La perte de focus met le jeu en pause et vide les entrées de déplacement."},{"id":"LD-048","category":"Sauvegarde","text":"Une importation vérifie l’identité du DLC, la version, la pièce et les valeurs numériques."},{"id":"LD-049","category":"Intégration","text":"L’installateur ajoute un dossier et un lanceur identifiables ; il ne remplace pas les autres DLC."},{"id":"LD-050","category":"Intégration","text":"Le lanceur est distinct d’une intégration native au GameEngine et au SaveSystem du jeu hôte."},{"id":"LD-051","category":"Intégration","text":"Une installation répétée n’ajoute pas un second lanceur."},{"id":"LD-052","category":"Intégration","text":"La désinstallation vérifie les modifications locales avant d’enlever des fichiers."},{"id":"LD-053","category":"Vérification","text":"Une capture du rapport provient du HTML livré exécuté dans Chromium, pas d’une image de présentation."},{"id":"LD-054","category":"Vérification","text":"Le chargement direct des 32 pièces ne remplace pas un parcours complet par les interactions."},{"id":"LD-055","category":"Vérification","text":"Les tests de logique et les tests navigateur sont rapportés séparément."},{"id":"LD-056","category":"Vérification","text":"L’absence de copie complète du jeu hôte interdit d’annoncer sa non-régression globale comme validée."},{"id":"LD-057","category":"Exploration","text":"Une annexe n’est pas un fait de la série : sa fonction et son statut original sont documentés."},{"id":"LD-058","category":"Exploration","text":"Les seize tâches annexes sont facultatives ; les trente-deux objectifs initiaux restent les verrous narratifs."},{"id":"LD-059","category":"Exploration","text":"Un raccourci s’ouvre par la tâche de son annexe et reste ouvert au retour et après sauvegarde."},{"id":"LD-060","category":"Exploration","text":"Chaque nouvel accès possède son retour et une arrivée sans collision."},{"id":"LD-061","category":"Confinement","text":"Une cloison fermée bloque marche, pathfinding, ligne de vue et projectiles."},{"id":"LD-062","category":"Confinement","text":"Une fermeture est refusée si une créature, le joueur ou un compagnon occupe son empreinte."},{"id":"LD-063","category":"Confinement","text":"Les commandes de cloison sont utilisables depuis les deux côtés ; aucune clé consommable ne peut enfermer le joueur."},{"id":"LD-064","category":"Confinement","text":"Une fuite indique sa phase active et peut être coupée définitivement par sa vanne."},{"id":"LD-065","category":"Furtivité","text":"Le bruit d’une balise est une position réellement visitée par l’IA, pas une téléportation."},{"id":"LD-066","category":"Furtivité","text":"Une cachette vue par l’ennemi ne supprime pas magiquement sa mémoire."},{"id":"LD-067","category":"Furtivité","text":"La torche participe à la détection dans les pièces sombres."},{"id":"LD-068","category":"Furtivité","text":"L’alerte et le dernier point observé persistent dans les états de pièce."},{"id":"LD-069","category":"Sauvetage","text":"Leïla, Tao, Mara et Ivo sont des personnages originaux et ne remplacent aucun destin canonique."},{"id":"LD-070","category":"Sauvetage","text":"Un compagnon utilise le sol et les obstacles du joueur et peut rester en attente dans une autre pièce."},{"id":"LD-071","category":"Sauvetage","text":"Une escorte est réussie à la balise d’évacuation, jamais à la seule validation du dialogue de libération."},{"id":"LD-072","category":"Sauvetage","text":"Un compagnon à terre consomme un kit pour être stabilisé ; les dégâts sont temporisés."},{"id":"LD-073","category":"Sauvegarde","text":"Historique V2 : migration depuis le schéma 1 sans perte de progression. Le contrat courant V4 est précisé en LD-139."},{"id":"LD-074","category":"Sauvegarde","text":"Les réserves ouvertes et les charges consommées ne se réinitialisent pas à la mort."},{"id":"LD-075","category":"Sauvegarde","text":"Une fermeture ou une fuite coupée doit survivre au chargement de la pièce."},{"id":"LD-076","category":"Sauvegarde","text":"Une version de sauvegarde inconnue est refusée, jamais normalisée silencieusement."},{"id":"LD-077","category":"Lecture","text":"Le plan du secteur est un graphe schématique de portes, pas un relevé métrique du décor."},{"id":"LD-078","category":"Lecture","text":"L’objectif principal, les relevés et le sac se lisent hors du champ jouable."},{"id":"LD-079","category":"Lecture","text":"La signalétique des portes nomme leur destination plutôt que l’identifiant technique."},{"id":"LD-080","category":"Lecture","text":"Aucun bouton de téléportation ou de complétion n’est présent dans les menus normaux."},{"id":"LD-081","category":"Poursuite","text":"Une identité de rencontre ne peut figurer que dans une seule pièce. Une migration retire la créature de la pièce de départ."},{"id":"LD-082","category":"Poursuite","text":"Une créature ne connaît que la porte dont elle a perçu la fuite. Aucune recherche omnisciente du joueur dans le graphe."},{"id":"LD-083","category":"Poursuite","text":"Le poursuivant hors écran parcourt le chemin au sol jusqu’au seuil ; le temps de trajet n’est pas un simple téléporteur à délai constant."},{"id":"LD-084","category":"Poursuite","text":"Une cloison fermée sur ce chemin bloque le poursuivant. Les meubles et les mêmes tests de collision restent actifs hors écran."},{"id":"LD-085","category":"Poursuite","text":"Seules les poursuites engagées sont mises à jour hors écran. Le reste de chaque pièce est dormant ; ne pas appeler cela un monde entièrement simulé."},{"id":"LD-086","category":"Poursuite","text":"L’arrivée est annoncée et impose un délai de récupération ; une créature ne frappe pas au premier instant du franchissement."},{"id":"LD-087","category":"Poursuite","text":"Les retours rapides à la pièce source annulent le trajet hors écran, puis restituent la même créature sur sa position réelle."},{"id":"LD-088","category":"Poursuite","text":"Les transferts de chapitre, de temporalité et de lieu majeur ne sont jamais des arêtes de poursuite."},{"id":"LD-089","category":"Confinement","text":"Un verrou de porte est le même sur ses deux faces. Il bloque le joueur comme les créatures."},{"id":"LD-090","category":"Confinement","text":"Le temps de fermeture et d’ouverture manuelle reste exposé aux attaques. Un impact annule le geste."},{"id":"LD-091","category":"Confinement","text":"Les coups contre le verrou diminuent sa résistance persistante. Le rouvrir ne répare pas la barre."},{"id":"LD-092","category":"Confinement","text":"Une barre rompue est signalée sur les deux faces et ne peut pas être refermée gratuitement."},{"id":"LD-093","category":"Acoustique","text":"Les surfaces dessinées au sol sont les zones effectivement interrogées par le bruit des pas."},{"id":"LD-094","category":"Acoustique","text":"Accroupi signifie moins bruyant, pas muet : le verre et le caillebotis conservent une émission locale."},{"id":"LD-095","category":"Acoustique","text":"Une écoute produit un indice daté et local. Une pièce silencieuse au relevé peut devenir dangereuse ensuite."},{"id":"LD-096","category":"Acoustique","text":"Les modales, la pause et la perte de focus arrêtent aussi les poursuites hors écran."},{"id":"LD-097","category":"Secours","text":"La tension des compagnons vient des menaces visibles, des impacts et des tirs proches ; aucune perte de contrôle aléatoire."},{"id":"LD-098","category":"Secours","text":"Rassurer exige de rester à portée pendant deux secondes, sans interrompre la simulation."},{"id":"LD-099","category":"Secours","text":"Un ordre collectif ne traverse pas les murs des autres pièces. Une personne à terre ne se relève pas sur ordre."},{"id":"LD-100","category":"Secours","text":"Une créature peut cibler un compagnon exposé. Le Facehugger peut viser un humain même lorsque Wendy mène le groupe."},{"id":"LD-101","category":"Navigation","text":"Le guidage de carte désigne un objectif et la prochaine porte accessible, sans déplacer le personnage ni valider la tâche."},{"id":"LD-102","category":"Navigation","text":"Le graphe de guidage tient compte des prérequis et signale les verrous fermés. Le joueur peut les ouvrir depuis le terrain."},{"id":"LD-103","category":"Sauvegarde","text":"Historique V3 : identités migrées, verrous, indices et tension conservés. Le schéma courant 4 accepte les schémas 1, 2 et 3 (LD-139)."},{"id":"LD-104","category":"Sauvegarde","text":"Les temps de récupération, étourdissements et rechargement sont conservés à travers une porte et un export."},{"id":"LD-105","category":"Sauvegarde","text":"Les gestes à maintenir et les modales ne sont pas validés par une importation ; ils sont annulés sans récompense."},{"id":"LD-106","category":"Sauvegarde","text":"Une sauvegarde migrée conserve une copie préalable par schéma, sans prétendre garantir une écriture multi-onglet atomique."},{"id":"LD-107","category":"Lecture","text":"Le journal ne contient que des événements vécus ou entendus. Aucun déplacement invisible ne doit devenir un radar gratuit."},{"id":"LD-108","category":"Lecture","text":"Les seuils portent leur destination, l’état de la barre, et, lorsqu’il est perçu, un signal d’arrivée."},{"id":"LD-109","category":"Actions","text":"Les tâches de dégagement héritées gardent les paliers de 0,5 seconde après interruption. Les nouveaux gestes de service V4 repartent à zéro, sans dépense ni gain partiel."},{"id":"LD-110","category":"QA","text":"Les captures préparées pour inspection doivent être distinguées du parcours complet du bot et des essais clavier."},{"id":"LD-111","category":"QA","text":"Conserver le bilan exact des contrôles, y compris échecs trouvés puis corrigés, limites navigateur et absence de fusion native."},{"id":"LD-112","category":"Réseaux","text":"Chaque chapitre possède son répartiteur indépendant. Un transfert ou un retour en arrière ne réinitialise pas les circuits des autres chapitres."},{"id":"LD-113","category":"Réseaux","text":"Deux départs sur trois sont alimentés : éclairage, extraction, surveillance. Trois configurations seulement sont acceptées."},{"id":"LD-114","category":"Réseaux","text":"Le mode Travail est le défaut de migration. Il préserve le comportement des fuites de V3 et ne bloque aucune tâche principale."},{"id":"LD-115","category":"Réseaux","text":"L’éclairage coupé réduit la visibilité artificielle. Il ne supprime ni la lumière naturelle d’une cour ou forêt ni une panne scénarisée non réparée."},{"id":"LD-116","category":"Réseaux","text":"Sans extraction, la phase dangereuse des fuites est allongée, mais une phase de repos subsiste. La vanne coupe toujours définitivement sa propre fuite."},{"id":"LD-117","category":"Réseaux","text":"La sélection arme la manœuvre sans effet. Elle attend le premier maintien E, puis exige 2,5 secondes sur place. Après le début, relâcher interrompt ; un mouvement ou un impact annule aussi la préparation."},{"id":"LD-118","category":"Réseaux","text":"Bouger, être frappé, lâcher la touche ou quitter la pièce interrompt une opération. Les commandes sont manuelles, utilisables même en mode Discrétion."},{"id":"LD-119","category":"Réseaux","text":"Les câbles et voyants portent le même identifiant de secteur que les appareils. Ils ne sont pas des murs ou des passerelles."},{"id":"LD-120","category":"Entretien","text":"Seize mallettes contiennent quatre pièces chacune. Collecte persistante et unique ; un stock plein laisse la mallette intacte."},{"id":"LD-121","category":"Entretien","text":"Le stock de pièces est borné à vingt-quatre. La création d’un objet consomme sa recette seulement à la fin du travail exposé."},{"id":"LD-122","category":"Entretien","text":"Un kit nécessite trois pièces et trois secondes ; une balise deux pièces et 2,5 secondes. Les plafonds de neuf outils restent en vigueur."},{"id":"LD-123","category":"Entretien","text":"Un établi est un équipement physique ; consulter les recettes dans le sac ne permet pas de fabriquer à distance."},{"id":"LD-124","category":"Entretien","text":"M répare le verrou proche en 3,5 secondes avec trois pièces. Une réparation est permise par liaison, commune aux deux faces."},{"id":"LD-125","category":"Entretien","text":"Une barre rompue peut être remplacée ; la réparation la rend intacte mais ne ferme pas une porte restée ouverte."},{"id":"LD-126","category":"Entretien","text":"Une interruption de réparation ne consomme pas les pièces. Ouvrir ou refermer ne répare toujours pas le verrou."},{"id":"LD-127","category":"Observation","text":"Chaque secteur propose deux caméras depuis un terminal local. Sans le départ Surveillance, une nouvelle acquisition est refusée."},{"id":"LD-128","category":"Observation","text":"Une acquisition exige 1,5 seconde exposée au terminal. L’écran présente un relevé ponctuel daté, pas une vidéo de toutes les salles simulées."},{"id":"LD-129","category":"Observation","text":"Le champ caméra est borné par sa direction, sa portée et les solides. Un acteur hors champ ou derrière un meuble n’est pas recensé."},{"id":"LD-130","category":"Observation","text":"Le dernier relevé peut devenir périmé : les habitants hors écran restent dormants, excepté les poursuites actives déjà engagées."},{"id":"LD-131","category":"Observation","text":"Le rapport caméra est une reconstruction tactique à partir des positions captées. Ce n’est pas une image officielle ni un flux vidéo filmé."},{"id":"LD-132","category":"Secours","text":"P tenu 1,2 seconde permet de soulever une personne à terre proche et visible. Les personnes debout reçoivent toujours les ordres H/Y/T."},{"id":"LD-133","category":"Secours","text":"Porter utilise les deux mains : pas de tir, recharge, outil, soin, fabrication ou niche tant que la personne n’a pas été déposée."},{"id":"LD-134","category":"Secours","text":"Le porteur marche à 58 % de sa vitesse normale et ne sprinte pas. La profondeur, les obstacles et les portes restent les mêmes."},{"id":"LD-135","category":"Secours","text":"Le blessé porté conserve son identité, sa santé et son statut à terre ; son transport ne le guérit pas."},{"id":"LD-136","category":"Secours","text":"Un seul blessé peut être porté. Une porte transfère cette personne avec le porteur, sans déplacer les autres compagnons restés loin."},{"id":"LD-137","category":"Secours","text":"P permet de déposer au sol sur une empreinte libre. Une mort dépose le blessé à l’endroit atteint plutôt que de l’emporter au checkpoint."},{"id":"LD-138","category":"Secours","text":"La balise accepte un blessé porté pour évacuation médicale. Ce succès est distingué du relevage avec un kit ; sa santé reste nulle dans le bilan."},{"id":"LD-139","category":"Sauvegarde","text":"Le schéma 4 accepte 1, 2 et 3. Une copie préalable du schéma précédent est conservée avant une migration de stockage réussie."},{"id":"LD-140","category":"Sauvegarde","text":"Pièces, mallettes, réseaux, réparations, relevés caméra et personne portée sont sérialisés. Un geste en cours ne s’achève jamais lors d’un import."},{"id":"LD-141","category":"Sauvegarde","text":"Une référence de portage invalide, éloignée ou déjà évacuée est rejetée. Aucun changement de chapitre ne crée un second blessé."},{"id":"LD-142","category":"Validation","text":"La QA sépare régression, tests ciblés à état préparé, parcours moteur avec IA et contrôles du navigateur. Un screenshot n’est pas une preuve de campagne entière."},{"id":"LD-143","category":"Validation","text":"Toutes les interactions nouvelles doivent rester accessibles en profondeur, en SIDE et via les passages du mode classique. Aucune tâche n’est déplacée pour masquer un conflit."},{"id":"LD-144","category":"Confinement","text":"Seuls Facehugger, Tique et Mouche sont compatibles. Ni Xénomorphe adulte, ni hôte mobile de l’Œil, ni Orchidée, ni Œil déjà captif ne sont des prises de ce dispositif."},{"id":"LD-145","category":"Confinement","text":"Rampeurs sélectionne Facehugger et Tique ; Volants sélectionne Mouche. Un réglage incompatible ne neutralise rien."},{"id":"LD-146","category":"Confinement","text":"Seize plateaux originaux sont placés dans seize pièces existantes. Les autres 32 pièces n’en acquièrent pas automatiquement."},{"id":"LD-147","category":"Confinement","text":"Le chapitre de réveil reste sans adversaire ajouté. Les deux plateaux de Neverland permettent une calibration à vide, sans prétendre capturer un spécimen."},{"id":"LD-148","category":"Confinement","text":"Un plateau est une empreinte franchissable au sol, pas un mur ni une cage infranchissable ajoutée à la navigation."},{"id":"LD-149","category":"Confinement","text":"Une cartouche est consommée à la fin des deux secondes de préparation. Déplacement, dommage ou relâchement avant la fin ne coûte rien."},{"id":"LD-150","category":"Confinement","text":"La réserve initiale est de deux cartouches, le plafond quatre. Un établi assemble une cartouche pour quatre pièces et trois secondes."},{"id":"LD-151","category":"Confinement","text":"Le plateau armé émet un appât à portée de 540 unités, susceptible d’attirer aussi une menace incompatible. La vue directe du joueur reste prioritaire."},{"id":"LD-152","category":"Confinement","text":"L’appât dure 45 secondes de temps de jeu, y compris dans une autre pièce. Menus ouverts : le temps de simulation n’avance pas."},{"id":"LD-153","category":"Confinement","text":"La prise exige la bonne espèce, une distance horizontale de 62 et une différence de profondeur de 24 au maximum, ainsi qu’une ligne de vue."},{"id":"LD-154","category":"Confinement","text":"La fermeture demande 0,8 seconde de présence continue. Sortir du volume ou changer de cible annule cette progression ; aucun verrouillage gratuit par import."},{"id":"LD-155","category":"Confinement","text":"Une prise immobilise la même identité au plateau. Elle ne crée ni copie, ni butin, ni ennemi supplémentaire."},{"id":"LD-156","category":"Confinement","text":"Une créature scellée ne patrouille, ne frappe, ne poursuit, ne tire et ne stresse plus les compagnons. Les flaques et projectiles déjà produits continuent d’exister."},{"id":"LD-157","category":"Confinement","text":"Une identité confinée reste lisible dans le registre ; l’écoute ne la présente pas comme une créature mobile derrière la porte."},{"id":"LD-158","category":"Confinement","text":"Une caméra peut relever la présence du spécimen, sans transformer une enceinte fermée en cible active de l’IA."},{"id":"LD-159","category":"Confinement","text":"Trois secondes d’étude exposée ajoutent une observation originale par identité. Répéter une prise n’accorde pas plusieurs validations du même spécimen."},{"id":"LD-160","category":"Confinement","text":"Un plateau armé, intact et encore inutilisé peut être démonté en une seconde et rendre une cartouche, si le stock le permet."},{"id":"LD-161","category":"Confinement","text":"Expiration, capture, rupture ou libération consomment définitivement la cartouche engagée. Aucun soin ou kit ne revient à la mort."},{"id":"LD-162","category":"Confinement","text":"Une libération est un choix confirmé, suivi de deux secondes sur place. La créature retrouve son identité, sa salle et une grâce de deux secondes sans frappe instantanée."},{"id":"LD-163","category":"Confinement","text":"Un Xénomorphe adulte en état actif peut attaquer une enceinte occupée à portée. L’attaque est annoncée puis ôte 30 points de résistance par seconde."},{"id":"LD-164","category":"Confinement","text":"La résistance d’une enceinte est de 100 ; la rupture libère le spécimen, sans le dupliquer et sans réparer le plateau. Une étude déjà enregistrée reste au registre."},{"id":"LD-165","category":"Confinement","text":"Les enceintes occupées hors écran sont inertes. Aucune simulation écologique globale ni combat automatique hors écran n’est revendiqué."},{"id":"LD-166","category":"Confinement","text":"Les captures restent facultatives. Ni porte principale ni objectif du scénario ne dépend d’une nouvelle étude."},{"id":"LD-167","category":"Confinement","text":"Les registres stockent salle, date, identité, preset et étude. Il s’agit des rencontres écrites du jeu, pas d’un décompte canonique de la série."},{"id":"LD-168","category":"Sauvegarde V5","text":"Le schéma 5 accepte 1, 2, 3 et 4 ; leurs ressources V4 sont conservées, et la V4 est copiée avant la première écriture V5 réussie."},{"id":"LD-169","category":"Sauvegarde V5","text":"Un doublon de spécimen, une espèce incompatible, une enceinte dans une autre salle ou une référence inconnue invalident le confinement importé."},{"id":"LD-170","category":"Sauvegarde V5","text":"Aucun geste actif, fermeture partielle, calibration ou menu n’est restauré. Une enceinte déjà scellée est restaurée, car elle est un état acquis."},{"id":"LD-171","category":"Sauvegarde V5","text":"Mourir conserve cartouches dépensées, études, enceintes, captures et identités libérées ; le checkpoint ne multiplie pas le matériel."},{"id":"LD-172","category":"Interface V5","text":"Le registre de confinement s’ouvre depuis le sac ou le journal ; il précise les résultats d’étude et la localisation sans téléportation."},{"id":"LD-173","category":"Interface V5","text":"La carte compte les enceintes occupées et les plateaux disponibles, pas des captures fictives."},{"id":"LD-174","category":"Interface V5","text":"La cloche fermée, sa silhouette captive et sa résistance sont des éléments du rendu réel. Les signes ne se réduisent pas à un menu textuel."},{"id":"LD-175","category":"Interface V5","text":"Une étape de calibration enseigne préparation et délai sans ajouter un organisme au chapitre de réveil. Le contenu demeure une adaptation non officielle."},{"id":"LD-176","category":"Sondes · mouvement et relais","text":"S-01 et S-02 sont deux unités identifiées, non deux copies créées par chaque pose. Le sac et le sol partagent la même identité."},{"id":"LD-177","category":"Sondes · mouvement et relais","text":"La pose prend 1,5 seconde exposée, à 60 unités devant le joueur. Le sol, les portes, commandes, cloisons et une seconde sonde sont contrôlés avant et après le geste."},{"id":"LD-178","category":"Sondes · mouvement et relais","text":"Un maintien interrompu ne pose rien et ne consomme pas de batterie. La préparation attend le premier maintien ; un mouvement ou impact annule."},{"id":"LD-179","category":"Sondes · mouvement et relais","text":"Le capteur posé reste traversable. Son pied participe au tri de profondeur, pas à une collision invisible."},{"id":"LD-180","category":"Sondes · mouvement et relais","text":"La récupération exige E au capteur et une seconde exposée. Elle conserve exactement la batterie restante, sans remise à neuf."},{"id":"LD-181","category":"Sondes · mouvement et relais","text":"Chaque unité possède 180 secondes de réserve initiale. Le temps de simulation décharge les unités posées, même dans une pièce distante. Les menus et la pause ne consomment rien."},{"id":"LD-182","category":"Sondes · mouvement et relais","text":"Les unités dans le sac ne se déchargent pas et ne se rechargent pas. La mort conserve les poses, consommations et relevés, sans ramener un appareil au checkpoint."},{"id":"LD-183","category":"Sondes · mouvement et relais","text":"Une recharge exige une unité portée, au moins 20 secondes manquantes, deux pièces et trois secondes sur un établi. Coût et bénéfice sont appliqués ensemble à la fin."},{"id":"LD-184","category":"Sondes · mouvement et relais","text":"La mesure regroupe les déplacements réels sur une demi-seconde. Le volume est de 460 unités pondérées X/Z ; mobilier et cloison masquent la mesure."},{"id":"LD-185","category":"Sondes · mouvement et relais","text":"Le seuil de mesure est de trois unités parcourues pendant la période. Une première présence immobile ou une restauration de position ne fabrique pas un mouvement."},{"id":"LD-186","category":"Sondes · mouvement et relais","text":"Une mesure n’enregistre ni espèce, ni nom, ni coordonnées de la cible : seulement gauche/proche/droite, résultat et date."},{"id":"LD-187","category":"Sondes · mouvement et relais","text":"Le joueur, les compagnons et l’escorte peuvent déclencher la mesure. Le système ne certifie pas une menace à partir du seul mouvement."},{"id":"LD-188","category":"Sondes · mouvement et relais","text":"Un spécimen confiné est absent de l’IA active et ne déclenche pas de mesure mobile. Sa capture ne supprime pas les mesures antérieures."},{"id":"LD-189","category":"Sondes · mouvement et relais","text":"Dans une pièce chargée, aucun mouvement mesuré est un constat ponctuel, pas une preuve de sécurité. Une Orchidée immobile ou un ennemi caché peut ne pas apparaître."},{"id":"LD-190","category":"Sondes · mouvement et relais","text":"Hors écran, seules les identités en poursuite déjà engagée sont échantillonnées. La mesure est partielle et les habitants dormants ne sont pas inventés comme actifs."},{"id":"LD-191","category":"Sondes · mouvement et relais","text":"Une salle hors écran sans trajectoire observable porte le statut NON OBSERVÉ, jamais AUCUN ENNEMI."},{"id":"LD-192","category":"Sondes · mouvement et relais","text":"La portée du récepteur est de deux liaisons intérieures accessibles au maximum. Un prérequis absent ou un verrou fermé coupe ce chemin abstrait de relais."},{"id":"LD-193","category":"Sondes · mouvement et relais","text":"La liaison ignore les transferts entre chapitres. La batterie affichée hors liaison est une estimation calculée ; les mesures reçues restent datées."},{"id":"LD-194","category":"Sondes · mouvement et relais","text":"Une mesure reçue est figée si le lien disparaît. Le journal garde quarante observations au maximum, pas une liste globale des acteurs."},{"id":"LD-195","category":"Sondes · mouvement et relais","text":"Les alertes sont limitées à une par sonde toutes les six secondes. Les signaux utilisent le son facultatif ; aucune piste officielle de la série n’est distribuée."},{"id":"LD-196","category":"Sondes · mouvement et relais","text":"Une émission sonore exige une sonde dans la pièce active, une liaison et 25 secondes de réserve. Quatre secondes d’appât et douze secondes entre émissions."},{"id":"LD-197","category":"Sondes · mouvement et relais","text":"Le bouton du récepteur prépare la commande puis reprend la simulation. Le coût et le bruit apparaissent au tick suivant, pas pendant un menu figé."},{"id":"LD-198","category":"Sondes · mouvement et relais","text":"Un déplacement de pièce, un impact avant transmission ou une annulation détruit la commande en attente. Elle n’est pas sérialisée."},{"id":"LD-199","category":"Sondes · mouvement et relais","text":"L’émission sonore respecte le comportement de poursuite à vue existant. Elle ne téléporte pas de créature et ne crée pas de recrutement hors écran."},{"id":"LD-200","category":"Sondes · mouvement et relais","text":"Le récepteur permet de suivre le lieu connu de la sonde, pas une cible libre. La carte ne révèle aucune position ennemie en temps réel."},{"id":"LD-201","category":"Sondes · mouvement et relais","text":"Une sonde abandonnée reste au sol quand le chapitre est quitté. Le transfert avertit le joueur ; ni la suite ni le mode Récit ne la rapatrient gratuitement."},{"id":"LD-202","category":"Sondes · mouvement et relais","text":"Le schéma 6 accepte V1 à V5 et fournit les deux appareils initiaux uniquement lors de cette migration. Un registre absent dans un export V6 est refusé."},{"id":"LD-203","category":"Sondes · mouvement et relais","text":"Une unité déployée exige une salle visitée non future, une position valide et une batterie bornée. Un doublon, une superposition ou des données incohérentes sont refusés."},{"id":"LD-204","category":"Sondes · mouvement et relais","text":"Les batteries et émissions déjà exécutées survivent à la sauvegarde. Le travail de pose/récupération/recharge et les déplacements partiels de mesure ne sont pas recréés à l’import."},{"id":"LD-205","category":"Sondes · mouvement et relais","text":"La V6 conserve les 48 pièces et 660 placements statiques V5. Les deux accessoires portables ne sont pas ajoutés au compte des sprites ou des espèces."},{"id":"LD-206","category":"Sondes · mouvement et relais","text":"Le récepteur est consultable au clavier et au tactile. Les états sont écrits en texte, pas portés uniquement par une couleur."},{"id":"LD-207","category":"Sondes · mouvement et relais","text":"Les outils des autres DLC, leurs sauvegardes MIRE et leurs récompenses stratégiques ne sont pas fusionnés par ce module autonome."},{"id":"LD-208","category":"Galeries · grilles et turbines","text":"Huit galeries techniques originales s’ajoutent aux 48 pièces de la V6. Leurs archives et consignations sont facultatives ; aucune nouvelle condition de fin de chapitre."},{"id":"LD-209","category":"Galeries · grilles et turbines","text":"Chaque galerie relie deux pièces du même chapitre par deux liaisons réciproques. Les transferts temporels et géographiques ne sont jamais des conduits."},{"id":"LD-210","category":"Galeries · grilles et turbines","text":"Les prérequis des deux entrées sont identiques dans chaque sens et conservent une tâche principale existante. Une grille ne valide ni tâche ni chapitre."},{"id":"LD-211","category":"Galeries · grilles et turbines","text":"E près d’une grille boulonnée prépare deux secondes de travail exposé. La grille ne disparaît qu’à la fin ; mouvement, impact et relâchement après le début interrompent."},{"id":"LD-212","category":"Galeries · grilles et turbines","text":"Une ouverture est partagée par les deux faces. Réappuyer sur E après l’ouverture permet de passer. Pas de téléportation pendant le dévissage."},{"id":"LD-213","category":"Galeries · grilles et turbines","text":"Les grilles déposées restent ouvertes. X et M ne leur ajoutent pas un verrou ni une réparation de porte standard."},{"id":"LD-214","category":"Galeries · grilles et turbines","text":"Une personne portée ne franchit pas l’ouverture basse. Il faut déposer ou stabiliser et emprunter un autre accès ; aucun patient n’est téléporté de l’autre côté."},{"id":"LD-215","category":"Galeries · grilles et turbines","text":"Le passage bas impose la marche accroupie. Sprint, tir et rechargement sont désactivés dans la galerie. La torche, le dégagement et les autres équipements restent soumis aux règles existantes."},{"id":"LD-216","category":"Galeries · grilles et turbines","text":"Les compagnons debout suivent les seuils proches avec la même identité. Leur pose dans la galerie est accroupie et leur déplacement respecte le même espace."},{"id":"LD-217","category":"Galeries · grilles et turbines","text":"Les Facehuggers, Tiques et Mouches peuvent suivre une poursuite déjà engagée à travers une grille ouverte. Aucun adulte ne se glisse à travers ces ouvertures dimensionnées pour le jeu."},{"id":"LD-218","category":"Galeries · grilles et turbines","text":"Un carter en marche constitue une collision et une coupure de visibilité réelles pour le joueur, les compagnons, les créatures, les tirs et les sondes."},{"id":"LD-219","category":"Galeries · grilles et turbines","text":"Chaque turbine possède un cycle de dix secondes : cinq de marche, trois de repos, deux de préalerte. La préalerte laisse encore le passage ouvert."},{"id":"LD-220","category":"Galeries · grilles et turbines","text":"Le redémarrage ne laisse pas un acteur dans la collision : il le repousse du côté le plus proche ; le joueur exposé reçoit un impact borné par les règles de dégâts existantes."},{"id":"LD-221","category":"Galeries · grilles et turbines","text":"La collision et la rotation dérivent du même état du moteur. Réduire les animations ne change ni le cycle, ni ses indications textuelles, ni le moment dangereux."},{"id":"LD-222","category":"Galeries · grilles et turbines","text":"Deux freins manuels permettent de consigner la turbine depuis chacun de ses côtés. Le maintien de 2,5 secondes enregistre la même tâche facultative, une seule fois."},{"id":"LD-223","category":"Galeries · grilles et turbines","text":"Une turbine consignée reste arrêtée à la mort, au changement de salle et à la reprise. Aucun remboursement d’outil ou gain de pièces ne vient du redémarrage de campagne."},{"id":"LD-224","category":"Galeries · grilles et turbines","text":"Le réseau électrique de chapitre ne commande pas ces moteurs locaux. La carte ne montre leur phase précise que dans la pièce courante ; leur arrêt acquis est persistant."},{"id":"LD-225","category":"Galeries · grilles et turbines","text":"Une sonde ne peut pas être posée dans le carter, même pendant son repos, ni devant une commande de frein. Un appareil valide avant le redémarrage ne devient pas coincé."},{"id":"LD-226","category":"Galeries · grilles et turbines","text":"Le relais radio ne traverse pas une grille encore boulonnée ; une grille déposée utilise une liaison comme une porte ouverte, dans la limite de deux franchissements."},{"id":"LD-227","category":"Galeries · grilles et turbines","text":"La poursuite hors écran conserve son contrat partiel. Elle respecte le carter actif de la pièce source et ne crée pas de patrouille globale."},{"id":"LD-228","category":"Galeries · grilles et turbines","text":"Les plans affichent sept espaces par chapitre et distinguent galeries techniques, annexes et route principale. Les lignes ne prétendent pas être métriques."},{"id":"LD-229","category":"Galeries · grilles et turbines","text":"Les hachures de grille et les signaux de turbine sont accompagnés de texte. Le danger ne repose pas uniquement sur la couleur ou le son."},{"id":"LD-230","category":"Galeries · grilles et turbines","text":"Les 660 placements anciens ne sont pas déplacés pour ajouter les grilles. Les points ajoutés doivent laisser accessibles les commandes, spawns et arrivées existants."},{"id":"LD-231","category":"Galeries · grilles et turbines","text":"Le schéma 7 accepte les sauvegardes 1 à 6 ; elles reçoivent des grilles fermées, sans perte des systèmes existants. Un registre V7 manquant est refusé."},{"id":"LD-232","category":"Galeries · grilles et turbines","text":"Une grille ouverte importée doit être connue, appartenir à un chapitre atteint et satisfaire ses prérequis. Un adulte migrant dans une galerie est refusé."},{"id":"LD-233","category":"Galeries · grilles et turbines","text":"Les gestes en cours ne sont pas importés comme terminés. Les turbines utilisent l’horloge du snapshot et non l’horloge réelle ; pause et menu ne les font pas avancer."},{"id":"LD-234","category":"Galeries · grilles et turbines","text":"Une reprise au milieu du carter actif replace le corps hors de la collision. Elle ne termine pas la consignation de la turbine."},{"id":"LD-235","category":"Galeries · grilles et turbines","text":"Les sept nouvelles apparitions de petits organismes sont des rencontres de jeu, pas sept nouvelles espèces ni un décompte d’individus canoniques."},{"id":"LD-236","category":"Galeries · grilles et turbines","text":"Le contenu antérieur est vérifié indépendamment des parcours empruntant les galeries. Les nouveaux trajets sont testés avec et sans arrêt des turbines."},{"id":"LD-237","category":"Galeries · grilles et turbines","text":"Le module demeure autonome : le lanceur ne fusionne pas ses salles, sa sauvegarde ou ses récompenses avec le moteur de Tantalus."},{"id":"LD-238","category":"Enquêtes et bilans","text":"Les huit enquêtes utilisent vingt-quatre archives existantes, sans déplacer leurs points de collecte."},{"id":"LD-239","category":"Enquêtes et bilans","text":"Un indice non ramassé reste masqué dans le dossier : son texte n’est pas créé par le menu."},{"id":"LD-240","category":"Enquêtes et bilans","text":"Les trois sources doivent être associées aux trois rôles du dossier avant de préparer une conservation."},{"id":"LD-241","category":"Enquêtes et bilans","text":"Une mauvaise association n’enlève ni document, ni ressource, ni accès à la campagne."},{"id":"LD-242","category":"Enquêtes et bilans","text":"Le raisonnement est un puzzle de l’adaptation, pas une preuve supplémentaire sur les événements de la série."},{"id":"LD-243","category":"Enquêtes et bilans","text":"Le dossier se consulte depuis le journal ; l’exécution exige son terminal physique dans le secteur actif."},{"id":"LD-244","category":"Enquêtes et bilans","text":"E au terminal ouvre ses services existants. Le choix Enquête conserve cet ancrage, sans seconde borne."},{"id":"LD-245","category":"Enquêtes et bilans","text":"Conserver localement exige deux secondes sur place ; diffuser exige quatre secondes et Surveillance alimentée."},{"id":"LD-246","category":"Enquêtes et bilans","text":"La préparation attend le premier maintien E. Relâcher après le début, bouger ou subir un impact annule."},{"id":"LD-247","category":"Enquêtes et bilans","text":"Une sélection de menu ne conserve ni ne transmet un dossier : seuls les gestes terminés écrivent la décision."},{"id":"LD-248","category":"Enquêtes et bilans","text":"La diffusion produit du bruit local pendant le maintien. Une annulation n’annule pas un bruit déjà entendu."},{"id":"LD-249","category":"Enquêtes et bilans","text":"La vue directe sur le joueur garde sa priorité. Une diffusion ne téléporte ni n’invoque un ennemi."},{"id":"LD-250","category":"Enquêtes et bilans","text":"La copie locale n’ajoute pas de bruit propre ; les dangers environnants et les bruits de déplacement restent actifs."},{"id":"LD-251","category":"Enquêtes et bilans","text":"La coupure de Surveillance avant la fin annule une diffusion sans écrire une décision."},{"id":"LD-252","category":"Enquêtes et bilans","text":"La destination est un choix unique par dossier ; revenir au terminal n’en fait pas une récompense répétable."},{"id":"LD-253","category":"Enquêtes et bilans","text":"Les deux décisions ont des conséquences de terrain et des traces différentes, sans bonus de santé ou de munitions."},{"id":"LD-254","category":"Enquêtes et bilans","text":"Transmis signifie envoyé dans la simulation locale ; aucun destinataire ni réception externe n’est attesté."},{"id":"LD-255","category":"Enquêtes et bilans","text":"Un bilan de secteur dénombre les faits acquis et distingue les personnes non rencontrées, à terre, laissées et évacuées."},{"id":"LD-256","category":"Enquêtes et bilans","text":"La clôture d’un secteur intervient au transfert validé, jamais lors de la simple ouverture du panneau de départ."},{"id":"LD-257","category":"Enquêtes et bilans","text":"Les bilans antérieurs migrés sont marqués reconstitués : une date de départ historique n’est pas inventée."},{"id":"LD-258","category":"Enquêtes et bilans","text":"Le registre des objectifs filtre principales, facultatives et archives ; suivre une cible ne valide aucune action."},{"id":"LD-259","category":"Enquêtes et bilans","text":"Les données d’archives connues restent relisibles depuis le carnet, y compris après le transfert de secteur."},{"id":"LD-260","category":"Enquêtes et bilans","text":"Le rapport JSON de terrain est distinct d’une sauvegarde et ne s’importe pas comme profil de jeu."},{"id":"LD-261","category":"Enquêtes et bilans","text":"Le schéma 8 accepte les schémas 1 à 7 sans résoudre les enquêtes. Un registre V8 manquant est refusé."},{"id":"LD-262","category":"Enquêtes et bilans","text":"Une décision exige trois preuves réellement acquises, une salle visitée et une date non future."},{"id":"LD-263","category":"Enquêtes et bilans","text":"Les preuves du rapport sont dérivées des données validées ; les compteurs importés ne font pas autorité."},{"id":"LD-264","category":"Enquêtes et bilans","text":"Les actions d’enquête et leurs associations en cours ne sont pas restaurées par un import."},{"id":"LD-265","category":"Enquêtes et bilans","text":"La mort conserve la décision déjà écrite, mais ne termine pas un geste interrompu."},{"id":"LD-266","category":"Enquêtes et bilans","text":"Les sauvegardes V7 sont copiées avant la première écriture V8 réussie, comme les versions antérieures."},{"id":"LD-267","category":"Enquêtes et bilans","text":"Les nouvelles interfaces gardent le focus clavier dans la modale, puis le rendent au terrain à la fermeture."},{"id":"LD-268","category":"Enquêtes et bilans","text":"Les scènes de navigateur préparées sont distinctes des parcours moteur complets sans injection de progression."},{"id":"LD-269","category":"Enquêtes et bilans","text":"La publication GitHub, le déploiement et la fusion MIRE ne sont pas effectués par le rapport de terrain."},{"id":"LD-270","category":"Sentinelles et alarmes","text":"Les huit sentinelles sont des dispositifs originaux, pas de nouvelles espèces ni des robots présentés comme canoniques."},{"id":"LD-271","category":"Sentinelles et alarmes","text":"Une unité par chapitre utilise une commande de service déjà présente, sans déplacer ni dupliquer les interactions V8."},{"id":"LD-272","category":"Sentinelles et alarmes","text":"Le départ Surveillance alimente caméras et sentinelles. Travail coupe les deux ; Observation et Discrétion les alimentent."},{"id":"LD-273","category":"Sentinelles et alarmes","text":"La consignation mécanique du dispositif reste indépendante des trois répartitions électriques et ne coupe pas les caméras."},{"id":"LD-274","category":"Sentinelles et alarmes","text":"Le balayage est dérivé du temps de simulation : quatorze secondes par oscillation ; réduire les animations ne change pas le cône réel."},{"id":"LD-275","category":"Sentinelles et alarmes","text":"Portée 760 unités et demi-angle 0,46 radian ; X et Z pondéré sont la base géométrique. Les solides et cloisons occultent la présence."},{"id":"LD-276","category":"Sentinelles et alarmes","text":"Seuls le joueur, l’escorte active et les compagnons debout locaux sont des silhouettes de contrôle. Aucune espèce n’est identifiée."},{"id":"LD-277","category":"Sentinelles et alarmes","text":"L’acquisition exige deux secondes de visibilité cumulées sur la même silhouette ; accroupissement du joueur à 55 % de cadence."},{"id":"LD-278","category":"Sentinelles et alarmes","text":"Perdre la silhouette fait baisser l’acquisition ; changer de silhouette remet la lecture à zéro. Le premier plan purement décoratif ne masque pas le capteur."},{"id":"LD-279","category":"Sentinelles et alarmes","text":"Une niche cache la silhouette seulement hors de vue : après l’entrée sous les yeux du capteur, sa courte mémoire visuelle reste active quatre secondes."},{"id":"LD-280","category":"Sentinelles et alarmes","text":"L’alarme dure six secondes, sans créer ni téléporter une créature. Elle émet au pied de la sentinelle, pas à des coordonnées cachées du joueur."},{"id":"LD-281","category":"Sentinelles et alarmes","text":"La vue directe des créatures garde priorité sur l’alarme, comme sur les balises. Le bruit le plus fort est retenu quand un bruit ordinaire le concurrence."},{"id":"LD-282","category":"Sentinelles et alarmes","text":"Le dispositif n’inflige pas directement de dégâts, ne ferme pas de porte et ne valide pas d’objectif."},{"id":"LD-283","category":"Sentinelles et alarmes","text":"Dix secondes séparent le début de deux alarmes. La mise hors tension suspend le bruit ; une remise sous tension ne réinitialise aucun délai."},{"id":"LD-284","category":"Sentinelles et alarmes","text":"E ouvre la commande, puis trois secondes exposées isolent définitivement le détecteur. Aucune pièce ni récompense n’est ajoutée."},{"id":"LD-285","category":"Sentinelles et alarmes","text":"Le test local exige Surveillance et un maintien E de 1,5 seconde ; il produit la même alarme audible et ne prétend pas être une simulation sans risque."},{"id":"LD-286","category":"Sentinelles et alarmes","text":"Sélectionner une opération prépare seulement le geste. Mouvement, impact et relâchement après le début interrompent sans effet acquis."},{"id":"LD-287","category":"Sentinelles et alarmes","text":"F à portée du pied utilise le dégagement existant et son coût normal ; le dispositif est aveuglé six secondes, sans dépense additionnelle."},{"id":"LD-288","category":"Sentinelles et alarmes","text":"Un projectile du joueur doit rejoindre le pied du dispositif dans la même profondeur ; les murs et obstacles interceptent d’abord les tirs."},{"id":"LD-289","category":"Sentinelles et alarmes","text":"Chaque impact enlève 34 points sur 100. Un détecteur détruit ne se répare pas, ne fournit aucun butin et ne se régénère pas au rechargement."},{"id":"LD-290","category":"Sentinelles et alarmes","text":"La résonance de Wendy ne commande pas ces appareils électroniques. Leur statut n’est pas une cible xénomorphe."},{"id":"LD-291","category":"Sentinelles et alarmes","text":"Le registre 4 est consultatif. Seule la commande physique peut préparer le test ou la consignation."},{"id":"LD-292","category":"Sentinelles et alarmes","text":"Un dispositif jamais observé n’affiche pas de lecture détaillée ; hors écran, le dernier état est daté et la pièce reste non observée."},{"id":"LD-293","category":"Sentinelles et alarmes","text":"Les autres pièces ne sont pas activées par ces sentinelles. Une alarme distante ne recrute pas de nouvelles poursuites."},{"id":"LD-294","category":"Sentinelles et alarmes","text":"La pause et les menus arrêtent les cycles ; un appel update avec zéro seconde ne fait pas avancer l’acquisition."},{"id":"LD-295","category":"Sentinelles et alarmes","text":"Le schéma 9 accepte 1 à 8 sans offrir de neutralisations. Un registre V9 incomplet est refusé."},{"id":"LD-296","category":"Sentinelles et alarmes","text":"Intégrité, isolement, observations, alarmes et délais sont conservés. Une lecture partielle et un geste en cours ne s’achèvent pas par import."},{"id":"LD-297","category":"Sentinelles et alarmes","text":"Les états inconnus, dates futures, interventions dans un chapitre futur et appareil neutralisé jamais observé sont refusés."},{"id":"LD-298","category":"Sentinelles et alarmes","text":"La mort conserve les neutralisations et les délais sans rappeler un appareil, ni restaurer munitions ou pièces."},{"id":"LD-299","category":"Sentinelles et alarmes","text":"Les captures préparées sont distinguées des campagnes moteur ; aucun test ne constitue à lui seul une garantie commerciale."},{"id":"LD-300","category":"Fidélité V10","text":"Aucune porte ordinaire intérieure ne reste isolée au milieu du plan de sol : seuil arrière ou extrémité de mur."},{"id":"LD-301","category":"Fidélité V10","text":"Le dessin de la porte et sa cible d’interaction partagent la même empreinte X/Z."},{"id":"LD-302","category":"Fidélité V10","text":"Les échelles de trappe et les balises de transfert ne sont pas des portes ordinaires."},{"id":"LD-303","category":"Fidélité V10","text":"Tout seuil réciproque recalcule son point d’arrivée depuis la face réellement dessinée."},{"id":"LD-304","category":"Fidélité V10","text":"La présence de passerelles de jeu ne certifie pas un plan de tournage."},{"id":"LD-305","category":"Fidélité V10","text":"Chaque nouveau lieu demeure facultatif et ne contourne aucune des quatre tâches principales."},{"id":"LD-306","category":"Fidélité V10","text":"Les PNJ nommés ont leur rôle de silhouette propre : Sylvia et Kirsh ne prennent plus celle d’Arthur."},{"id":"LD-307","category":"Fidélité V10","text":"Morrow conserve sa peau brune, ses cheveux courts, sa barbe et sa veste crème ; Joe ne porte plus un casque générique permanent."},{"id":"LD-308","category":"Fidélité V10","text":"La tenue de Wendy dépend du chapitre et non d’un sprite unique pour toutes les scènes."},{"id":"LD-309","category":"Fidélité V10","text":"La lame de massicot n’est disponible que pendant le sauvetage après observation acquise."},{"id":"LD-310","category":"Fidélité V10","text":"La mousse du KSG-AL exige une cible déjà étourdie, un même plan et une visibilité libre."},{"id":"LD-311","category":"Fidélité V10","text":"Les réserves d’arc et de mousse sont finies, ne se remplissent pas en changeant de pièce ou en mourant."},{"id":"LD-312","category":"Fidélité V10","text":"Le registre distingue équipement jouable, décor représenté, référence non intégrée et invention de jeu."},{"id":"LD-313","category":"Fidélité V10","text":"Un portrait de référence ne fait pas d’un personnage un PNJ présent dans tous les lieux."},{"id":"LD-314","category":"Fidélité V10","text":"La V10 accepte les sauvegardes V1 à V9, sans offrir les prises facultatives nouvelles."},{"id":"LD-315","category":"Fidélité V10","text":"Le statut 1:1 n’est pas attribué tant que les scènes, plans et accessoires ne sont pas relevés et vérifiés intégralement."},{"id":"LD-316","category":"Fidélité V11","text":"Un lieu peut être attesté sans que sa position relative soit attestée : le codex distingue les deux."},{"id":"LD-317","category":"Fidélité V11","text":"Les nouvelles pièces de référence restent facultatives et n’entrent pas dans les quatre objectifs principaux d’un chapitre."},{"id":"LD-318","category":"Fidélité V11","text":"Un accès V11 est placé sur une embrasure arrière atteignable ; il ne flotte pas au milieu du sol."},{"id":"LD-319","category":"Fidélité V11","text":"Chaque nouvelle face possède une face réciproque et un point d’arrivée dégagé recalculé depuis celle-ci."},{"id":"LD-320","category":"Fidélité V11","text":"Medbay One, engineering room, containment room, lobby, atrium, talking room, medical bay et secure lab sont marqués comme lieux attestés, pas comme blueprints exacts."},{"id":"LD-321","category":"Fidélité V11","text":"La cryostase étendue, le réfectoire et la passerelle du Maginot conservent leur identité de décor distincte."},{"id":"LD-322","category":"Fidélité V11","text":"Les membres nommés de l’équipage du Maginot disposent d’un profil visuel dédié lorsqu’ils sont référencés par le jeu."},{"id":"LD-323","category":"Fidélité V11","text":"Un profil visuel dans le registre ne crée pas automatiquement un PNJ dans une scène où sa présence n’est pas simulée."},{"id":"LD-324","category":"Fidélité V11","text":"Joe peut distinguer son MCS-X de son sidearm Maxim 9 ; les deux ne deviennent pas des armes de Morrow."},{"id":"LD-325","category":"Fidélité V11","text":"Le pistolet de Morrow reste visuellement distinct des armes Prodigy."},{"id":"LD-326","category":"Fidélité V11","text":"Le KRISS Vector est signalé comme référence non jouable tant que sa dotation exacte par scène n’est pas simulée."},{"id":"LD-327","category":"Fidélité V11","text":"Les systèmes inventés du DLC restent marqués adaptation et ne sont jamais promus en accessoires officiels."},{"id":"LD-328","category":"Fidélité V11","text":"Les raccords de décor construits sur un même stage peuvent inspirer une boucle cohérente sans être présentés comme une adjacency filmée exacte."},{"id":"LD-329","category":"Fidélité V11","text":"La V11 accepte les sauvegardes V1 à V10 sans accomplir les nouveaux objectifs facultatifs."},{"id":"LD-330","category":"Fidélité V11","text":"Aucun ancien seuil V10 n’est déplacé par la génération V11 ; seuls les nouveaux seuils sont ancrés et audités."},{"id":"LD-331","category":"Fidélité V11","text":"Le statut global demeure fidélité progressive tant qu’un relevé plan par plan complet n’a pas été réalisé."}],"status":{"nativeHostIntegration":false,"launcherIntegration":true,"productionArt":false,"coop":false,"season2":false,"story":"Saison 1 adaptée ; dialogues et plans originaux ; scènes intermédiaires condensées.","secondaryCast":"4 personnages originaux","originalAnnexes":16,"fieldResearch":true,"physicalContainment":true,"interRoomPursuit":true,"continuousWorldSimulation":false,"doorListening":true,"survivorStress":true,"portableSensors":true,"anonymousMotionReports":true,"technicalDucts":true,"investigations":true,"security":true,"fidelity":"fidélité progressive sourcée ; lieux élargis, géométrie toujours reconstituée"},"survivors":[{"id":"leila","name":"Leïla","room":"R35","task":"AE-35","evac":"R08","evacX":300,"evacZ":125,"health":65,"role":"Secouriste civile","status":"Personnage original de cette adaptation"},{"id":"tao","name":"Tao","room":"R38","task":"AE-38","evac":"R12","evacX":300,"evacZ":125,"health":65,"role":"Technicien de la tour","status":"Personnage original de cette adaptation"},{"id":"mara","name":"Mara","room":"R44","task":"AE-44","evac":"R24","evacX":300,"evacZ":125,"health":65,"role":"Technicienne des fluides","status":"Personnage original de cette adaptation"},{"id":"ivo","name":"Ivo","room":"R45","task":"AE-45","evac":"R28","evacX":300,"evacZ":125,"health":65,"role":"Gardien des balises","status":"Personnage original de cette adaptation"}],"equipment":[{"id":"decoys","name":"Balise sonore","key":"B","description":"Réserve finie. Lance une balise devant vous ; elle s’arrête avant un obstacle et attire les créatures qui ne vous voient pas. Sept secondes, aucune garantie de sécurité."},{"id":"care","name":"Kit de stabilisation","key":"U","description":"Restaure 40 points d’intégrité. Consommé uniquement si nécessaire. Une charge peut aussi stabiliser un compagnon à terre."},{"id":"scan","name":"Relevé de terrain","key":"N maintenu","description":"Trois secondes d’observation d’une créature visible, à moins de 600 unités. Bouger, être frappé ou perdre la vue annule le relevé en cours."},{"id":"hide","name":"Niche de service","key":"E près de la niche","description":"Dissimule le joueur immobile. Ne protège pas si l’adversaire vous a vu entrer. E ou un déplacement permet de ressortir."},{"id":"door-seal","key":"X MAINTENU","name":"Verrou manuel de seuil — X maintenu","description":"X tenu : verrouiller ou ouvrir en une seconde. M tenu : réparation unique à trois pièces et 3,5 secondes, y compris après rupture."},{"id":"door-listen","key":"G MAINTENU","name":"Écouter à la porte — G maintenu","description":"Une seconde et demie immobile près d’une porte. Donne un indice daté sur une présence proche de l’autre face, jamais une carte des créatures."},{"id":"calm","key":"T MAINTENU","name":"Rassurer — T maintenu","description":"Deux secondes près du compagnon le plus tendu. Interrompu en bougeant, par un impact ou par une porte quittée."},{"id":"orders","key":"H / Y / SAC","name":"Ordres locaux — H / Y","description":"H : regrouper les compagnons de la pièce. Y : leur demander d’attendre. Le mode discret est disponible depuis le sac."},{"id":"parts","name":"Pièces détachées","key":"E / ÉTABLI","description":"Quatre pièces par mallette, seize mallettes. Stock maximal : 24. Recettes aux établis ; réparation des verrous avec M."},{"id":"grid","name":"Répartiteur de secteur","key":"E MAINTENU","description":"Deux départs sur trois : Travail, Observation ou Discrétion. Choisissez sur le tableau puis maintenez E 2,5 secondes sur place."},{"id":"camera","name":"Relevé de surveillance","key":"E MAINTENU","description":"Alimentez Surveillance. Choisissez une des deux caméras et maintenez E 1,5 seconde au terminal. Relevé daté et limité au champ."},{"id":"carry","name":"Transport d’un blessé","key":"P MAINTENU","description":"1,2 seconde près d’une personne à terre. Mains occupées, marche ralentie. P pour déposer ; la balise reçoit les blessés portés."},{"id":"containment-kit","name":"Confinement de terrain","key":"E AU PLATEAU","description":"Deux cartouches au départ, quatre au maximum. Choisissez Rampeurs ou Volants, puis maintenez E deux secondes. Attirez la créature sur le plateau ; le filet se ferme après 0,8 seconde de présence continue. Appât pendant 45 secondes. Les gros organismes ne sont pas capturables."},{"id":"containment-study","name":"Étude sous enceinte","key":"E · ÉTUDE / LIBÉRATION","description":"Trois secondes au plateau scellé documentent cette identité une seule fois. Libération manuelle en deux secondes, sans cartouche rendue. Un Xénomorphe libre peut rompre l’enceinte : n’en faites pas un refuge garanti."},{"id":"field-sensors-v6","name":"Deux sondes de mouvement","key":"1 MAINTENU / 2","description":"1 maintenu : pose de 1,5 seconde sur sol libre. 2 : récepteur. E près de la sonde : récupération exposée d’une seconde. 180 secondes d’autonomie, sans recharge gratuite dans le sac. Les mouvements du joueur et des compagnons déclenchent aussi la mesure."},{"id":"sensor-receiver-v6","name":"Récepteur de proximité","key":"2 / SAC","description":"Liaison limitée à deux portes intérieures accessibles et déverrouillées. Mesure datée sans nom ni position précise. Les obstacles masquent le capteur ; une absence de mouvement ne prouve pas une pièce sûre. Hors écran, seules les poursuites déjà actives peuvent être observées, le reste est signalé non observé."},{"id":"sensor-service-v6","name":"Entretien et émission des sondes","key":"ÉTABLI / RÉCEPTEUR","description":"Sonde portée : deux pièces et trois secondes à l’établi restaurent 180 secondes, si au moins 20 ont été consommées. Une impulsion distante dans la pièce active coûte 25 secondes d’autonomie et dure quatre secondes. Pas de contrôle sonore des populations hors écran."},{"id":"technical-ducts-v7","name":"Grilles de maintenance","key":"E MAINTENU","description":"Deux secondes pour déposer une grille accessible, sans pièce consommée. L’ouverture est partagée entre ses faces et reste ouverte. Réappuyer sur E pour entrer. Passage accroupi automatique, interdit au portage. Les petits organismes peuvent suivre ; pas les adultes par ces grilles étroites."},{"id":"duct-brake-v7","name":"Frein de turbine","key":"E MAINTENU","description":"Cycle de 10 secondes : 5 en marche, 3 de repos, 2 de préalerte avant redémarrage. Le carter en marche bloque tout franchissement. Deux freins accessibles depuis chaque côté ; 2,5 secondes pour l’arrêt permanent. Les pauses figent le cycle. La commande électrique du chapitre ne remplace pas le frein."},{"id":"dossiers-v8","name":"Carnet d’enquêtes","key":"3 / JOURNAL / TERMINAL","description":"Associez trois documents réellement récupérés. Au terminal du secteur, maintenez E pour conserver localement en deux secondes ou diffuser en quatre secondes avec Surveillance. La diffusion fait du bruit ; les deux issues sont uniques."},{"id":"security-v9","name":"Registre des sentinelles","key":"4 / COMMANDE LOCALE","description":"Huit contrôles optiques alimentés par Surveillance. Deux secondes de détection, six secondes de bruit local. E puis maintien pour isoler ou tester ; F au pied aveugle temporairement. Trois impacts détruisent le détecteur."}],"surfaceMaterials":{"quiet":{"label":"Revêtement souple","noise":0.62,"mark":"soft"},"tile":{"label":"Dalles","noise":1,"mark":"tile"},"grate":{"label":"Caillebotis","noise":1.45,"mark":"grate"},"glass":{"label":"Éclats de verre","noise":1.8,"mark":"glass"},"wet":{"label":"Sol humide","noise":1.25,"mark":"wet"},"soil":{"label":"Terre et végétation","noise":0.74,"mark":"soil"}},"powerModes":[{"id":"work","label":"Travail","channels":["light","extraction"],"description":"Éclairage de service et extraction. Les caméras restent hors ligne."},{"id":"watch","label":"Observation","cha const V4_MODES = new Set(EARTH_DATA.powerModes.map(m => m.id));
const V4_ENEMIES=Object.fromEntries(EARTH_DATA.rooms.flatMap(r=>r.enemies.map(e=>[e.id,e])));
const V4_CAMERA = Object.fromEntries(EARTH_DATA.cameras.map(c => [c.id,c]));
const V4_SCRAP = new Set(EARTH_DATA.rooms.flatMap(r => r.interactables.filter(i=>i.kind==='scrap').map(i=>i.id)));
const v4Finite = (n,min,max,fallback=0) => Number.isFinite(n) ? Math.max(min,Math.min(max,n)) : fallback;
const v4DefaultStats = () => ({switches:0,crafts:0,repairs:0,captures:0,lifts:0,medicalEvacs:0});
function initialServicesV4(){
 return {parts:0,salvaged:[],circuits:Object.fromEntries(EARTH_DATA.networks.map(n=>[n.id,'work'])),repairedDoors:[],cameraFrames:{},carryId:null,serviceStats:v4DefaultStats()};
}
/** Untrusted JSON is bounded independently of V1–V3 fields. Gestures are never restored. */
function upgradeServicesV4(s,raw,rooms,doorKeys){
 Object.assign(s,initialServicesV4());s.schema=4;s.version=EARTH_DATA.version;
 if(raw.schema<4)return s;
 s.parts=Math.floor(v4Finite(raw.parts,0,24));
 s.salvaged=[...new Set((Array.isArray(raw.salvaged)?raw.salvaged:[]).filter(id=>V4_SCRAP.has(id)))];
 s.repairedDoors=[...new Set((Array.isArray(raw.repairedDoors)?raw.repairedDoors:[]).filter(id=>doorKeys.has(id)))];
 for(const n of EARTH_DATA.networks)if(V4_MODES.has(raw.circuits?.[n.id]))s.circuits[n.id]=raw.circuits[n.id];
 for(const key of Object.keys(s.serviceStats))s.serviceStats[key]=Math.floor(v4Finite(raw.serviceStats?.[key],0,999999));
 const f=s.survivors[raw.carryId];
 if(f&&f.status==='down'&&f.hp<=0&&f.room===s.room&&Math.abs(f.x-s.player.x)<110&&Math.abs(f.z-s.player.z)<45){s.carryId=f.id;f.x=s.player.x;f.z=s.player.z;}
 for(const cam of EARTH_DATA.cameras){
  const frame=raw.cameraFrames?.[cam.id],r=rooms[cam.room];
  if(!frame||frame.room!==cam.room||!Number.isFinite(frame.time)||frame.time<0||frame.time>s.playSeconds)continue;
  const points=(Array.isArray(frame.points)?frame.points:[]).slice(0,20).filter(p=>p&&['organism','person'].includes(p.type)&&Number.isFinite(p.x)&&Number.isFinite(p.z)&&p.x>=35&&p.x<=r.width-35&&p.z>=25&&p.z<=225).map(p=>({x:p.x,z:p.z,type:p.type,heavy:p.heavy===true,confined:p.confined===true}));
  const closedGate=frame.closedGate===true&&!!r.gate;
  s.cameraFrames[cam.id]={camera:cam.id,room:cam.room,time:frame.time,points,closedGate,powered:frame.powered===true};
 }
 return s;
}
