<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>015 Prowler — revue V75 candidate</title>
<style>
body{margin:16px;background:#101c25;color:#deebed;font:15px system-ui}h1{font-size:21px;margin:0 0 6px}p{margin:6px 0}button,select{font:inherit;padding:7px;margin-right:8px}section{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:12px;margin-top:12px}article{border:1px solid #476576;background:#253c47}h2{font-size:16px;padding:8px;margin:0}canvas{display:block;width:100%;height:auto}output{display:block;font-family:monospace;margin-top:6px}@media(max-width:640px){section{grid-template-columns:1fr}}
</style>
<h1>Prowler 015 · lecteur candidat, pas une acceptation runtime</h1>
<p>Atlas 32 poses · 352 × 352 en jeu proposé · pivot 128/240. La garde aérienne est dans le dessin : aucune translation Y ajoutée.</p>
<button id="toggle">Pause</button><button id="previous">Pose précédente</button><button id="next">Pose suivante</button>
<label>Cadence <select id="fps"><option value="12">12 fps</option><option value="6">6 fps</option></select></label>
<button id="mirror">Miroir</button><output id="status">Chargement des pixels…</output><section id="clips"></section>
<script type="module">
const clips=['idle','move','attack','death'];const contexts=clips.map(name=>{
 const article=document.createElement('article');const title=document.createElement('h2');title.textContent=name;
 const canvas=document.createElement('canvas');canvas.width=512;canvas.height=260;article.append(title,canvas);document.querySelector('#clips').append(article);return canvas.getContext('2d');
});
const atlas=new Image();atlas.src='/assets/openai/sprites/normalized/enemy-profiles-v66/enemy-015-prowler.webp';await atlas.decode();
let running=true,frame=0,last=performance.now(),clock=0,mirror=1;
const counts=clips.map(()=>Array(8).fill(0));window.prowlerReview={counts,lastFrames:[],atlasSha256:'5462eb30975dcdf83b29e02bf5aff8e65de5fbe92aecb0958c09af1e887e6b52'};
function draw(){contexts.forEach((ctx,c)=>{
 const i=c*8+frame;counts[c][frame]++;ctx.fillStyle='#647c83';ctx.fillRect(0,0,512,260);
 ctx.strokeStyle='#70ff9e';ctx.beginPath();ctx.moveTo(0,220);ctx.lineTo(512,220);ctx.stroke();
 ctx.imageSmoothingEnabled=false;ctx.save();ctx.translate(256,220);ctx.scale(mirror,1);
 ctx.drawImage(atlas,i%4*256,Math.floor(i/4)*256,256,256,-176,-330,352,352);ctx.restore();
 ctx.fillStyle='#e9ffff';ctx.font='13px monospace';ctx.fillText(`Pose ${frame+1}/8 · atlas ${i}`,12,245);
 });window.prowlerReview.lastFrames=clips.map((_,c)=>c*8+frame);document.querySelector('#status').textContent=`${running?'Lecture':'Pause'} · pose ${frame+1}/8 · ${document.querySelector('#fps').value} fps · face ${mirror===1?'droite':'gauche'}`;
}
function pause(){running=false;document.querySelector('#toggle').textContent='Lecture';clock=0;draw();}
document.querySelector('#toggle').onclick=()=>{running=!running;document.querySelector('#toggle').textContent=running?'Pause':'Lecture';clock=0;draw();};
document.querySelector('#previous').onclick=()=>{frame=(frame+7)%8;pause();};document.querySelector('#next').onclick=()=>{frame=(frame+1)%8;pause();};
document.querySelector('#mirror').onclick=()=>{mirror*=-1;draw();};
function tick(now){if(running){clock+=Math.min(100,now-last);const period=1000/Number(document.querySelector('#fps').value);if(clock>=period){frame=(frame+Math.floor(clock/period))%8;clock%=period;draw();}}last=now;requestAnimationFrame(tick);}draw();requestAnimationFrame(tick);
</script></html>
