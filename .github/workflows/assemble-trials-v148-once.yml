name: Assemble reviewed Trials V148 once
on:
  pull_request:
    paths: ['.github/workflows/assemble-trials-v148-once.yml']
permissions:
  contents: read
jobs:
  assemble:
    if: github.event.pull_request.number == 9 && github.repository == 'darknigthmare/aliens-tantalus-frontier' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/audit-hardening-v143'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE: a0fa13ba426d53cc2794ddab666bfec9bc7882e8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restore hash-pinned reviewed files without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, base64, hashlib, lzma, subprocess, urllib.request
          from pathlib import Path
          root=Path.cwd(); out=Path(os.environ['RUNNER_TEMP'])/'v148-assembled'; out.mkdir(exist_ok=True)
          workflow='.github/workflows/assemble-trials-v148-once.yml'
          base=os.environ['BASE']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_HEAD']
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==base
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()==[workflow]
          api='https://api.github.com/repos/darknigthmare/aliens-tantalus-frontier'
          def request(path, value=None):
              assert path.startswith('/git/blobs') or path=='/git/trees'
              data=None if value is None else json.dumps(value).encode()
              req=urllib.request.Request(api+path,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='GET' if value is None else 'POST')
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          def sha(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def read_blob(key):
              value=request('/git/blobs/'+key)
              assert value['encoding']=='base64'
              data=base64.b64decode(value['content'])
              assert value['sha']==key and sha(data)==key
              return data
          keys=['d6506ed72aaa98b5409fb75240c201daa8c3d717','6a725d1e1cf6d116bc32cbbb1490292c3bbdacac','b349d4e52bef1fce70269f0893a649f806da8925']
          compressed=base64.b64decode(b''.join(read_blob(key) for key in keys),validate=True)
          assert len(compressed)==43128
          assert hashlib.sha256(compressed).hexdigest()=='f4dbb75c59f4405ccef56c425741fdb172085bbc3dd4e8b24f9249d994836c57'
          payload=lzma.decompress(compressed,memlimit=256*1024*1024)
          assert len(payload)==94760
          bundle=json.loads(payload); manifest=bundle['manifest']
          known={'src/xeno-trials-supers-v148.js':'4ba2df8881af57465ec6c0604520f53d6fb85a1b','src/xeno-trials-signatures-v147.js':'3a1c2e77790e6ed1d7fd98b64fc2539e163fe504','src/xeno-trials-engine-v96.js':'2cc2f18fa1936836db6f8bfae65c565498ed09ff','src/xeno-trials-ai-v119.js':'14038d1bfb2f5705ba96d5ed98d34c9a4573cd2f','src/xeno-trials-runtime-v96.js':'e133aca47f0f5cae8dcf68c2f13285699333b413','src/xeno-trials-ui-v96.js':'8744dd8c4f0307001857d52c1037e1ea737e5e54'}
          book='docs/forge/xeno-trials/XENO_TRIALS_SUIVI_V148.xlsx'
          remaining={'src/xeno-trials-data-v96.js','scripts/verify-xeno-trials-supers-v148.mjs','scripts/qa-xeno-trials-signatures-v147.py','scripts/verify-public-release-v86.mjs','sw.js','package.json','xeno-trials-fullscreen-v119.css','docs/forge/xeno-trials/progress-v148.json','docs/forge/xeno-trials/V148-SUPERS.md'}
          assert set(manifest)==set(known)|remaining|{book}
          patch=out/'reviewed.patch'; patch.write_text(bundle['patch'],encoding='utf-8')
          names={line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()}
          assert names==remaining
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          for path,key in known.items():
              data=read_blob(key)
              if path=='src/xeno-trials-ui-v96.js':
                  # Correct one known transcription in the unreferenced transfer blob.
                  # The complete resulting file is independently hash-pinned below.
                  text=data.decode(); prefix,body=text.split('  renderPreviews() {',1)
                  assert 'this.activityV119, state.modesV119' in body
                  body=body.replace('this.activityV119, state.modesV119','this.activityV119, this.state().modesV119',1)
                  data=(prefix+'  renderPreviews() {'+body).encode()
              (root/path).write_bytes(data)
          subprocess.run(['git','apply',str(patch)],check=True)
          (root/book).write_bytes(base64.b64decode(bundle['xlsx'],validate=True))
          for path,expected in manifest.items():
              data=(root/path).read_bytes()
              assert len(data)==expected['bytes'] and sha(data)==expected['sha'] and hashlib.sha256(data).hexdigest()==expected['sha256'],path
              destination=out/'files'/path; destination.parent.mkdir(parents=True,exist_ok=True); destination.write_bytes(data)
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          subprocess.run(['git','rm',workflow],check=True)
          subprocess.run(['git','add','--',*sorted(manifest)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines())==set(manifest)
          tree_sha=subprocess.check_output(['git','write-tree'],text=True).strip()
          elements=[]
          for path,expected in manifest.items():
              data=(root/path).read_bytes()
              created=request('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert created['sha']==expected['sha'],path
              elements.append({'path':path,'mode':'100644','type':'blob','sha':created['sha']})
          tree=request('/git/trees',{'base_tree':'9b047fea02dae8df157cc7926f3cb19c3bed6b46','tree':elements})
          assert tree['sha']==tree_sha
          (out/'assembled-tree.json').write_text(json.dumps({'base':base,'stagingCommit':os.environ['EXPECTED_HEAD'],'tree':tree_sha,'files':len(manifest),'branchUpdated':False},indent=2)+'\n')
          print('Verified 16 reviewed files and immutable tree '+tree_sha+'; no branch update performed.')
          PY
      - name: Verify supers, signatures, lifecycle and planning with complete media
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/verify-xeno-trials-supers-v148.mjs scripts/verify-xeno-trials-signatures-v147.mjs scripts/verify-xeno-trials-v145.mjs scripts/verify-xeno-trials-plan-v146.mjs 2>&1 | tee "$RUNNER_TEMP/v148-assembled/targeted-tests.log"
          npm run check 2>&1 | tee "$RUNNER_TEMP/v148-assembled/source-check.log"
      - name: Retain files and immutable tree for connected publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v148-assembled
          retention-days: 7
          path: ${{ runner.temp }}/v148-assembled
          if-no-files-found: error
