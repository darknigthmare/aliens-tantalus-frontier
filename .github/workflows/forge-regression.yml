name: Frontier Forge regression
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/forge-regression.yml'
permissions:
  contents: read
concurrency:
  group: forge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Authoring and runtime contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p forge-ci-results
          node --version | tee forge-ci-results/node-version.txt
          npm run test:forge 2>&1 | tee forge-ci-results/forge-tests.log
      - name: Native production engine
        shell: bash
        run: |
          set -o pipefail
          if [ -f scripts/verify-forge-native-v131.mjs ]; then
            node --test scripts/verify-forge-native-v131.mjs 2>&1 | tee forge-ci-results/native-tests.log
          fi
      - name: Preserve reproducible code and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-code-and-tests
          retention-days: 7
          path: |
            src
            scripts
            package.json
            forge-ci-results
          if-no-files-found: error
