name: Frontier Forge regression
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'assets/openai/metroidvania/props/**'
      - 'assets/openai/hub/props/v139/**'
      - 'package.json'
      - 'sw.js'
      - '.github/workflows/forge-regression.yml'
permissions:
  contents: read
concurrency:
  group: forge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  forge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
            assets/openai/metroidvania/props
            assets/openai/hub/props/v139
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Authoring and runtime contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p forge-ci-results
          node --version | tee forge-ci-results/node-version.txt
          npm run test:forge 2>&1 | tee forge-ci-results/forge-tests.log
      - name: Published native contract and targeted gameplay regressions
        shell: bash
        run: |
          set -o pipefail
          npm run test:forge:native 2>&1 | tee forge-ci-results/native-tests.log
          node --test scripts/verify-player-runtime-v124.mjs scripts/verify-player-field-actions-v124.mjs scripts/verify-player-incapacitation-v128.mjs scripts/verify-weapon-runtime-v124.mjs scripts/verify-weapon-effects-v124.mjs 2>&1 | tee forge-ci-results/gameplay-regressions.log
      - name: Chromium and Python browser tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real-browser HTTP and storage checks
        shell: bash
        run: |
          set -o pipefail
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python scripts/verify-forge-browser-v130.py --output forge-ci-results/browser 2>&1 | tee forge-ci-results/browser.log
          python scripts/verify-forge-browser-v133.py --output forge-ci-results/browser-v133 2>&1 | tee forge-ci-results/browser-v133.log
          python scripts/verify-forge-browser-v134.py --output forge-ci-results/browser-v134 2>&1 | tee forge-ci-results/browser-v134.log
          python scripts/verify-forge-browser-v135.py --output forge-ci-results/browser-v135 2>&1 | tee forge-ci-results/browser-v135.log
          python scripts/verify-forge-browser-v136.py --output forge-ci-results/browser-v136 2>&1 | tee forge-ci-results/browser-v136.log
          python scripts/verify-forge-browser-journey-v141.py --output forge-ci-results/browser-journey-v141 2>&1 | tee forge-ci-results/browser-journey-v141.log
      - name: Preserve reproducible code, native props and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-code-and-tests
          retention-days: 7
          path: |
            src
            scripts
            package.json
            *.html
            *.css
            sw.js
            manifest.webmanifest
            assets/openai/metroidvania/props
            assets/openai/hub/props/v139
            forge-ci-results
          if-no-files-found: error
