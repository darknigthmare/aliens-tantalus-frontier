name: Assemble reviewed Trials V153 once
on:
  pull_request:
    paths: ['.github/workflows/assemble-trials-v153-once.yml']
permissions:
  contents: read
jobs:
  assemble:
    if: github.event.pull_request.number == 9 && github.repository == 'darknigthmare/aliens-tantalus-frontier' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/audit-hardening-v143'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE: 15b4c7e02a47ff581b3c1f8d1e7a80ac09eee142
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restore reviewed files into an immutable tree, without updating a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, base64, hashlib, lzma, subprocess, urllib.request, io, zipfile
          from pathlib import Path
          root=Path.cwd(); out=Path(os.environ['RUNNER_TEMP'])/'v153-assembled'; out.mkdir(exist_ok=True)
          workflow='.github/workflows/assemble-trials-v153-once.yml'
          base=os.environ['BASE']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_HEAD']
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==base
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()==[workflow]
          api='https://api.github.com/repos/darknigthmare/aliens-tantalus-frontier'
          def request(path, value=None):
              assert path.startswith('/git/blobs') or path=='/git/trees'
              data=None if value is None else json.dumps(value).encode()
              req=urllib.request.Request(api+path,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='GET' if value is None else 'POST')
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          def sha(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def read_blob(key):
              value=request('/git/blobs/'+key)
              assert value['encoding']=='base64'
              data=base64.b64decode(value['content'])
              assert value['sha']==key and sha(data)==key
              return data
          keys=['9503f5ee60f5fe5896b7b478dabed793664f0b6d','07abe444a359f2cb7c95136eba2d330db07e29f6','feaed49a636dade9e231d12801ffb1288e1e63e7','346d36bafc8555e9e4c4797b1df3bb3c996d1835','e13facc2a6694e4829fb4c32cdf072fcd7d9454e']
          compressed=base64.b64decode(b''.join(read_blob(key) for key in keys),validate=True)
          assert len(compressed)==38064
          assert hashlib.sha256(compressed).hexdigest()=='ceaf5f7561c50484939d8a77e4f0ce9ae491728b4984130c00a8fe49ddf02cec'
          payload=lzma.decompress(compressed,memlimit=256*1024*1024)
          assert len(payload)==344914
          bundle=json.loads(payload); manifest=bundle['manifest']; assert bundle['base']==base
          book='docs/forge/xeno-trials/XENO_TRIALS_SUIVI_V153.xlsx'
          allowed={'.github/workflows/full-release-v143.yml','docs/forge/xeno-trials/V153-PROWLER-RESTRAINT.md','docs/forge/xeno-trials/progress-v153.json',book,'package.json','scripts/qa-xeno-trials-grapple-v153.py','scripts/verify-public-release-v86.mjs','scripts/verify-xeno-trials-grapple-v153.mjs','src/xeno-trials-ai-v119.js','src/xeno-trials-engine-v96.js','src/xeno-trials-grapple-v153.js','src/xeno-trials-runtime-v96.js','src/xeno-trials-ui-v96.js','sw.js'}
          assert set(manifest)==allowed
          patch=out/'reviewed.patch'; patch.write_text(bundle['patch'],encoding='utf-8')
          names={line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()}
          assert names==allowed-{book}
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          # Lossless packaging of the artifact_tool-authored workbook members.
          # Every cell, style, formula and cached value is preserved verbatim.
          members=bundle['workbookMembers']; assert len(members)==26
          packed=io.BytesIO()
          with zipfile.ZipFile(packed,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for name,data in sorted(members.items()):
                  assert not name.startswith('/') and '..' not in name.split('/')
                  info=zipfile.ZipInfo(name,date_time=(2026,10,17,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16
                  archive.writestr(info,data.encode('utf-8'),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          (root/book).write_bytes(packed.getvalue())
          elements=[]
          for path,expected in manifest.items():
              data=(root/path).read_bytes()
              assert len(data)==expected['bytes'] and sha(data)==expected['sha'] and hashlib.sha256(data).hexdigest()==expected['sha256'],path
              destination=out/'files'/path; destination.parent.mkdir(parents=True,exist_ok=True); destination.write_bytes(data)
              created=request('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert created['sha']==expected['sha'],path
              elements.append({'path':path,'mode':'100644','type':'blob','sha':created['sha']})
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          subprocess.run(['git','rm',workflow],check=True)
          subprocess.run(['git','add','--',*sorted(manifest)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines())==allowed
          tree_sha=subprocess.check_output(['git','write-tree'],text=True).strip()
          tree=request('/git/trees',{'base_tree':'eed588c2b0e9df0881edb8a2484639675e4b8dad','tree':elements})
          assert tree['sha']==tree_sha
          (out/'assembled-tree.json').write_text(json.dumps({'base':base,'stagingCommit':os.environ['EXPECTED_HEAD'],'tree':tree_sha,'files':len(manifest),'branchUpdated':False},indent=2)+'\n')
          print('Verified fourteen reviewed files and immutable tree '+tree_sha+'; no branch update performed.')
          PY
      - name: Test Trials and source distribution with complete media
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/verify-xeno-trials-grapple-v153.mjs scripts/verify-xeno-trials-castes-v151.mjs scripts/verify-xeno-trials-acid-v152.mjs scripts/verify-xeno-trials-signatures-v147.mjs scripts/verify-xeno-trials-supers-v148.mjs scripts/verify-xeno-trials-feedback-v149.mjs scripts/verify-xeno-trials-controls-v150.mjs scripts/verify-xeno-trials-v145.mjs scripts/verify-xeno-trials-plan-v146.mjs 2>&1 | tee "$RUNNER_TEMP/v153-assembled/targeted-tests.log"
          npm run check 2>&1 | tee "$RUNNER_TEMP/v153-assembled/source-check.log"
      - name: Retain reviewed files and immutable tree for connected publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v153-assembled
          retention-days: 7
          path: ${{ runner.temp }}/v153-assembled
          if-no-files-found: error
