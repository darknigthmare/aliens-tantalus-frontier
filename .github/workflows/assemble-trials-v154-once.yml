name: Assemble reviewed Trials V154 once
on:
  pull_request:
    paths: ['.github/workflows/assemble-trials-v154-once.yml']
permissions:
  contents: read
jobs:
  assemble:
    if: github.event.pull_request.number == 9 && github.repository == 'darknigthmare/aliens-tantalus-frontier' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/audit-hardening-v143'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE: 493f3535d6ef1b66780071c3b290257f114bda75
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify reviewed files and create only immutable blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,base64,hashlib,lzma,subprocess,urllib.request,io,zipfile
          from pathlib import Path
          root=Path.cwd(); out=Path(os.environ['RUNNER_TEMP'])/'v154-assembled';out.mkdir(exist_ok=True)
          workflow='.github/workflows/assemble-trials-v154-once.yml'
          base=os.environ['BASE']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_HEAD']
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==base
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()==[workflow]
          api='https://api.github.com/repos/darknigthmare/aliens-tantalus-frontier'
          def request(path,value=None):
              assert path=='/git/blobs' or path.startswith('/git/blobs/')
              req=urllib.request.Request(api+path,data=None if value is None else json.dumps(value).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='GET' if value is None else 'POST')
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          def sha(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def read_blob(key):
              value=request('/git/blobs/'+key);assert value['encoding']=='base64'
              data=base64.b64decode(value['content']);assert value['sha']==key and sha(data)==key
              return data
          keys=['e155e4fbd2663f3c646123853e5765feab2ed4ad','424adfb2813a3ff52e8f834489ac9d786954dcac','db49a9cf293ca42962a5a0f31195a5cf36411ea9','ecb57253ad85ba3d8b674376f6f1a5e17c7a495e']
          compressed=base64.b64decode(b''.join(read_blob(key) for key in keys),validate=True)
          assert len(compressed)==39436 and hashlib.sha256(compressed).hexdigest()=='bbade02ca5292da62f8d840e85ba460cbacf1f75ef7ebea73fdaea241c94b7c2'
          payload=lzma.decompress(compressed,memlimit=256*1024*1024);assert len(payload)==374915
          bundle=json.loads(payload);manifest=bundle['manifest'];assert bundle['base']==base
          book='docs/forge/xeno-trials/XENO_TRIALS_SUIVI_V154.xlsx'
          allowed={'.github/workflows/full-release-v143.yml','docs/forge/xeno-trials/V154-NATIVE-RIGS.md','docs/forge/xeno-trials/progress-v154.json',book,'package.json','scripts/qa-xeno-trials-rig-v154.py','scripts/verify-public-release-v86.mjs','scripts/verify-xeno-trials-rig-v154.mjs','src/xeno-trials-rig-data-v154.js','src/xeno-trials-rig-v154.js','src/xeno-trials-runtime-v96.js','src/xeno-trials-ui-v96.js','sw.js'}
          assert set(manifest)==allowed
          patch=out/'reviewed.patch';patch.write_text(bundle['patch'],encoding='utf-8')
          names={line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()}
          assert names==allowed-{book}
          subprocess.run(['git','apply','--check',str(patch)],check=True);subprocess.run(['git','apply',str(patch)],check=True)
          # Lossless ZIP-envelope restoration of the artifact_tool-authored XLSX.
          # Member text, cell data, formulas, cached values and styles are unchanged.
          members=bundle['workbookMembers'];assert len(members)==29
          packed=io.BytesIO()
          with zipfile.ZipFile(packed,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for name,text in sorted(members.items()):
                  assert not name.startswith('/') and '..' not in name.split('/')
                  info=zipfile.ZipInfo(name,date_time=(2026,10,17,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16
                  archive.writestr(info,text.encode(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          (root/book).write_bytes(packed.getvalue())
          elements=[]
          for path,expected in manifest.items():
              data=(root/path).read_bytes()
              assert len(data)==expected['bytes'] and sha(data)==expected['sha'] and hashlib.sha256(data).hexdigest()==expected['sha256'],path
              destination=out/'files'/path;destination.parent.mkdir(parents=True,exist_ok=True);destination.write_bytes(data)
              created=request('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'});assert created['sha']==expected['sha'],path
              elements.append({'path':path,'mode':'100644','type':'blob','sha':created['sha']})
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (out/'tree-elements.json').write_text(json.dumps(elements,indent=2)+'\n')
          subprocess.run(['git','rm',workflow],check=True);subprocess.run(['git','add','--',*sorted(manifest)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines())==allowed
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          (out/'assembled-tree.json').write_text(json.dumps({'base':base,'stagingCommit':os.environ['EXPECTED_HEAD'],'tree':tree,'files':len(manifest),'branchUpdated':False},indent=2)+'\n')
          print('Thirteen exact reviewed files verified; no branch or remote tree update performed.')
          PY
      - name: Test native rigs and historical control paths with complete media
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/verify-xeno-trials-rig-v154.mjs scripts/verify-xeno-trials-grapple-v153.mjs scripts/verify-xeno-trials-controls-v150.mjs scripts/verify-xeno-trials-v145.mjs 2>&1 | tee "$RUNNER_TEMP/v154-assembled/targeted-tests.log"
          npm run check 2>&1 | tee "$RUNNER_TEMP/v154-assembled/source-check.log"
      - name: Retain exact reviewed files and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v154-assembled
          retention-days: 7
          path: ${{ runner.temp }}/v154-assembled
          include-hidden-files: true
          if-no-files-found: error
