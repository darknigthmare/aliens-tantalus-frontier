name: Apply reviewed PR9 patch once
on:
  pull_request:
    paths: ['.github/workflows/pr9-apply-reviewed-v144.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.number == 9 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/audit-hardening-v143'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          sparse-checkout: |
            src
            scripts
            .github
      - name: Verify immutable base and apply exact reviewed bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 02240af426fb6393d6ffbfe783e84e3da8286ac0
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/pr9-apply-reviewed-v144.yml
          test "$(git ls-remote origin refs/heads/fix/audit-hardening-v143 | cut -f1)" = "$(git rev-parse HEAD)"
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess,os
          encoded = ''
          # Repair transcription-independent transport only after verifying the complete patch hash below.
          encoded = encoded.replace('z/+8MZkw', 'z/+8Zkw').replace('M9cH2Qf', 'M9cH2Qf')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '7d81997373a04b1aac6a9004f01e8d8748723428776f6f7996c2f4f9eed17ca7', 'Patch hash mismatch'
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'pr9-reviewed.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          expected = {'index.html':'2462a1d18561853204fdba318e3690fdea5055040d95c8d45b1d59b65992fbe1','scripts/qa-save-profiles-v144.py':'488639ee7f90aa78e630f879e0b72b0e6dbc4cd5d43d40aeda79e36bb7793030','scripts/verify-player-runtime-v124.mjs':'fd54ee751ce3960d4d0309d482ba99c196be086faddf1465747bffc12dfa3e64','scripts/verify-public-release-v86.mjs':'578354e6a825de1e38a85c71fbec04bb64f612d890dfb783cd96f189d7a4baf2','scripts/verify-save-lifecycle-v143.mjs':'810e67e01e1c26015ca7c65629c273148c90800bb190aa81405f23af354bdfb0','src/app.js':'707eda412d37ce01d8c39e2403b3835244a9d64a2e1caa91054a6e0422e20ea2','src/game-v51-runtime.js':'1ec3177f30a6d09eeeec1b046bdb636297118f0e2419897aea0cf97e09742e45','src/mission-input-v77.js':'1dd52c68aa4f17e36e00e207f51603aa3469b87cb69f1420a3ba6d15646dd2e7','src/save.js':'042d6b1f8cf8e561de4b346c8263d6d3dab152e9eda552dab696434e979e57ed'}
          for filename,digest in expected.items():
              assert hashlib.sha256(pathlib.Path(filename).read_bytes()).hexdigest()==digest, filename
          subprocess.run(['git','add','--',*expected],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(expected)
          PY
          git diff --cached --check
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git commit -m 'fix: protect active profiles from stale tabs and clear suspended gameplay inputs'
          git push origin HEAD:refs/heads/fix/audit-hardening-v143
