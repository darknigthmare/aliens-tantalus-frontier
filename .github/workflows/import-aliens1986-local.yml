name: Import verified Aliens 1986 local source
on:
  push:
    branches: ['codex/integrate-aliens-1986-local-20261125']
    paths: ['.github/workflows/import-aliens1986-local.yml']
permissions:
  contents: write
concurrency:
  group: aliens1986-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'darknigthmare/aliens-tantalus-frontier'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Fetch and verify the exact local Git bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/aliens1986.bundle"
          curl --fail --location --retry 2 --max-time 240 --proto '=https' --tlsv1.2 \
            'https://sb-1y1azo8esxn6.vercel.run/aliens1986.bundle' -o "$bundle"
          printf '%s  %s\n' '3e24fc045b7cc1728be5a22ba597a622c2fe5538711b92f104209a26aeafd81d' "$bundle" | sha256sum -c -
          git bundle verify "$bundle"
          git fetch --no-tags "$bundle" refs/heads/aliens1986-export
          test "$(git rev-parse FETCH_HEAD)" = '9937f71efa8b0e1ce691d16c1bca783dff87b3d7'
          test "$(git rev-parse FETCH_HEAD^{tree})" = '88369022aedf8e87da9af5d019560e8982bdb27b'
          test "$(git rev-parse FETCH_HEAD^)" = '001a20bdc0f9f1a3c835e84d8f3c9434bc159330'
          test "$(git ls-tree -r --name-only FETCH_HEAD -- modules/aliens-1986/v114 | wc -l)" -eq 1159
      - name: Publish recovered files without changing workflow permissions
        shell: bash
        run: |
          set -euo pipefail
          imported='9937f71efa8b0e1ce691d16c1bca783dff87b3d7'
          branch='refs/heads/codex/integrate-aliens-1986-local-20261125'
          workflow='.github/workflows/import-aliens1986-local.yml'
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          export GIT_INDEX_FILE="$RUNNER_TEMP/aliens1986-import.index"
          git read-tree "$imported^{tree}"
          git update-index --force-remove .github/workflows/aliens1986-dlc.yml
          helper_blob="$(git rev-parse "$GITHUB_SHA:$workflow")"
          git update-index --add --cacheinfo "100644,$helper_blob,$workflow"
          imported_tree="$(git write-tree)"
          git diff --exit-code "$GITHUB_SHA" "$imported_tree" -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published="$(git commit-tree "$imported_tree" -p "$GITHUB_SHA" -m 'Restore verified Aliens 1986 source and launcher from local bundle')"
          git push origin "$published:$branch"
          printf 'Imported source commit: `%s`\n\nSource tree before temporary workflow adjustment: `88369022aedf8e87da9af5d019560e8982bdb27b`.\n\nThe connected GitHub integration will replace this one-shot workflow with the validated read-only DLC CI workflow.\n' "$published" >> "$GITHUB_STEP_SUMMARY"
