name: Aliens 1986 DLC

on:
  pull_request:
    paths:
      - 'modules/aliens-1986/**'
      - 'dlc/aliens-1986/**'
      - 'assets/dlc/aliens-1986/**'
      - 'docs/development/aliens-1986-sprites-v116/**'
      - 'docs/development/aliens-1986-sprites-v117/**'
      - 'docs/development/aliens-1986-sprites-v118/**'
      - 'docs/development/aliens-1986-sprites-v119/**'
      - 'docs/development/aliens-1986-sprites-v120/**'
      - 'scripts/*aliens1986*'
      - 'scripts/build.mjs'
      - 'scripts/dev.mjs'
      - 'scripts/verify-public-release-v86.mjs'
      - 'scripts/audit-native-qa-resources-v187.mjs'
      - 'scripts/qa-title-compositions-v163.py'
      - 'src/title-screen-v61.js'
      - 'src/app.js'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/aliens1986-dlc.yml'
  push:
    branches: [main]
    paths:
      - 'modules/aliens-1986/**'
      - 'dlc/aliens-1986/**'
      - 'assets/dlc/aliens-1986/**'
      - 'docs/development/aliens-1986-sprites-v116/**'
      - 'docs/development/aliens-1986-sprites-v117/**'
      - 'docs/development/aliens-1986-sprites-v118/**'
      - 'docs/development/aliens-1986-sprites-v119/**'
      - 'docs/development/aliens-1986-sprites-v120/**'
      - 'scripts/*aliens1986*'
      - 'scripts/build.mjs'
      - 'scripts/dev.mjs'
      - 'scripts/verify-public-release-v86.mjs'
      - 'scripts/audit-native-qa-resources-v187.mjs'
      - 'scripts/qa-title-compositions-v163.py'
      - 'src/title-screen-v61.js'
      - 'src/app.js'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/aliens1986-dlc.yml'

concurrency:
  group: aliens1986-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aliens1986:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm ci
      - name: Test the preserved DLC, raster presentation, menus and source succession
        run: |
          npm run test:dlc:aliens1986
          npm run test:dlc:river
          node --test scripts/verify-river-of-pain-succession.mjs
      - name: Validate source and build the deterministic derivative
        run: |
          npm run check:dlc:aliens1986
          npm run check
          npm run build
          npm run check:built
      - name: Install the browser harness
        run: |
          python3 -m venv "$RUNNER_TEMP/aliens1986-playwright"
          "$RUNNER_TEMP/aliens1986-playwright/bin/pip" install playwright==1.65.2
          "$RUNNER_TEMP/aliens1986-playwright/bin/python" -m playwright install --with-deps chromium
      - name: Inspect the seven V117 prop variants with the real renderer
        run: |
          "$RUNNER_TEMP/aliens1986-playwright/bin/python" -B scripts/qa-aliens1986-props-v117.py \
            --source-root . --output "$RUNNER_TEMP/aliens1986-evidence/props-v117"
      - name: Inspect V118 supports and sentry directions with the real renderer
        run: |
          "$RUNNER_TEMP/aliens1986-playwright/bin/python" -B scripts/qa-aliens1986-props-v118.py \
            --source-root . --output "$RUNNER_TEMP/aliens1986-evidence/props-v118"
      - name: Inspect V119 furniture and supported props with the real renderer
        run: |
          "$RUNNER_TEMP/aliens1986-playwright/bin/python" -B scripts/qa-aliens1986-furniture-v119.py \
            --source-root . --output "$RUNNER_TEMP/aliens1986-evidence/furniture-v119"
      - name: Inspect V120 worktops, cabinets, reused rack and display bank
        run: |
          "$RUNNER_TEMP/aliens1986-playwright/bin/python" -B scripts/qa-aliens1986-furniture-v120.py \
            --source-root . --output "$RUNNER_TEMP/aliens1986-evidence/furniture-v120"
      - name: Exercise served raster drawing, doors, saves and title navigation
        run: |
          "$RUNNER_TEMP/aliens1986-playwright/bin/python" -B scripts/qa-aliens1986-integration.py \
            --root dist --source-root . --output "$RUNNER_TEMP/aliens1986-evidence"
      - name: Verify all title actions on desktop and mobile
        run: |
          "$RUNNER_TEMP/aliens1986-playwright/bin/python" -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/aliens1986-title-server.log" 2>&1 &
          ALIENS_TITLE_SERVER_PID=$!
          trap 'kill "$ALIENS_TITLE_SERVER_PID" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/build-info.json > /dev/null
          "$RUNNER_TEMP/aliens1986-playwright/bin/python" -B scripts/qa-title-compositions-v163.py \
            --base http://127.0.0.1:4173 --output "$RUNNER_TEMP/aliens1986-evidence/title-compositions"
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aliens1986-browser-evidence
          path: '${{ runner.temp }}/aliens1986-evidence'
          if-no-files-found: ignore
          retention-days: 7
