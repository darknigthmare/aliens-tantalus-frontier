name: Full release regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: All registered Node suites with complete media
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/atf-release-qa"
          git rev-parse HEAD | tee "$RUNNER_TEMP/atf-release-qa/source-commit.txt"
          npm run test:all 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/node-tests.log"
      - name: Guard and build the complete distribution
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/source-check.log"
          npm run build 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/build.log"
          npm run check:built 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/distribution-check.log"
          cp dist/build-info.json "$RUNNER_TEMP/atf-release-qa/"
      - name: Browser tooling outside the release
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/atf-browser" --no-save --ignore-scripts playwright@1.57.0
      - name: Real worker offline and account-isolation checks
        run: python scripts/qa-service-worker-v143.py --output "$RUNNER_TEMP/atf-release-qa/worker"
      - name: Production Forge checkpoint and real reload
        id: forge_checkpoint
        shell: bash
        run: |
          set -o pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/atf-release-qa/http-checkpoint.log" 2>&1 &
          checkpoint_server=$!
          trap 'kill "$checkpoint_server"' EXIT
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/build-info.json > /dev/null && break; sleep 1; done
          export ATF_BASE_URL=http://127.0.0.1:4173
          export ATF_CHROMIUM_EXECUTABLE="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python scripts/qa-forge-playtest-checkpoint-v157.py --output "$RUNNER_TEMP/atf-release-qa/forge-checkpoint-v157" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/forge-checkpoint-v157.log"
      - name: Production player controls and modular costumes
        id: player_journey
        if: ${{ !cancelled() && (steps.forge_checkpoint.outcome == 'success' || steps.forge_checkpoint.outcome == 'failure') }}
        shell: bash
        run: |
          set -o pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/atf-release-qa/http-player.log" 2>&1 &
          player_server=$!
          trap 'kill "$player_server"' EXIT
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/build-info.json > /dev/null && break; sleep 1; done
          export ATF_BASE_URL=http://127.0.0.1:4173
          export ATF_PLAYWRIGHT_MODULE="$RUNNER_TEMP/atf-browser/node_modules/playwright/index.mjs"
          export ATF_PLAYER_QA_OUTPUT="$RUNNER_TEMP/atf-release-qa/player"
          export ATF_CHROMIUM_EXECUTABLE="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          node scripts/qa-player-browser-v124.mjs 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/player.log"
      - name: Production V160 anatomy, motion detector and campaign journeys
        id: continuation_v160
        if: ${{ !cancelled() && (steps.forge_checkpoint.outcome == 'success' || steps.forge_checkpoint.outcome == 'failure') && (steps.player_journey.outcome == 'success' || steps.player_journey.outcome == 'failure') }}
        shell: bash
        run: |
          set -o pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/atf-release-qa/http-continuation-v160.log" 2>&1 &
          continuation_server=$!
          trap 'kill "$continuation_server"' EXIT
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/build-info.json > /dev/null && break; sleep 1; done
          export ATF_BASE_URL=http://127.0.0.1:4173
          export ATF_PLAYWRIGHT_MODULE="$RUNNER_TEMP/atf-browser/node_modules/playwright/index.mjs"
          export ATF_CHROMIUM_EXECUTABLE="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          # Run every V160 profile in order, retaining each report on failure.
          status=0
          python scripts/qa-player-anatomy-v160.py --base "$ATF_BASE_URL" --comparison-stage after --output "$RUNNER_TEMP/atf-release-qa/player-anatomy-v160" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/player-anatomy-v160.log" || { status=1; echo '::error title=Browser QA::qa-player-anatomy-v160.py failed; inspect its retained report.'; }
          python scripts/qa-motion-tracker-v160.py --base "$ATF_BASE_URL" --output "$RUNNER_TEMP/atf-release-qa/motion-tracker-v160" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/motion-tracker-v160.log" || { status=1; echo '::error title=Browser QA::qa-motion-tracker-v160.py failed; inspect its retained report.'; }
          python scripts/qa-campaign-story-v160.py --base "$ATF_BASE_URL" --output "$RUNNER_TEMP/atf-release-qa/campaign-story-v160" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/campaign-story-v160.log" || { status=1; echo '::error title=Browser QA::qa-campaign-story-v160.py failed; inspect its retained report.'; }
          exit "$status"
      - name: Production V161 Forge campaign, convoy story and crew service journeys
        id: continuation_v161
        if: ${{ !cancelled() && (steps.continuation_v160.outcome == 'success' || steps.continuation_v160.outcome == 'failure') }}
        shell: bash
        run: |
          set -o pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/atf-release-qa/http-continuation-v161.log" 2>&1 &
          continuation_server=$!
          trap 'kill "$continuation_server"' EXIT
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/build-info.json > /dev/null && break; sleep 1; done
          export ATF_BASE_URL=http://127.0.0.1:4173
          export ATF_CHROMIUM_EXECUTABLE="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          status=0
          python scripts/qa-forge-campaign-v161.py --output "$RUNNER_TEMP/atf-release-qa/forge-campaign-v161" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/forge-campaign-v161.log" || { status=1; echo '::error title=Browser QA::qa-forge-campaign-v161.py failed; inspect its retained report.'; }
          python scripts/qa-campaign-convoy-v161.py --output "$RUNNER_TEMP/atf-release-qa/campaign-convoy-v161" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/campaign-convoy-v161.log" || { status=1; echo '::error title=Browser QA::qa-campaign-convoy-v161.py failed; inspect its retained report.'; }
          python scripts/qa-npc-service-routes-v161.py --output "$RUNNER_TEMP/atf-release-qa/npc-service-routes-v161" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/npc-service-routes-v161.log" || { status=1; echo '::error title=Browser QA::qa-npc-service-routes-v161.py failed; inspect its retained report.'; }
          exit "$status"
      - name: Remaining production menu and tactical gameplay journeys
        if: ${{ !cancelled() && (steps.forge_checkpoint.outcome == 'success' || steps.forge_checkpoint.outcome == 'failure') && (steps.player_journey.outcome == 'success' || steps.player_journey.outcome == 'failure') && (steps.continuation_v160.outcome == 'success' || steps.continuation_v160.outcome == 'failure') }}
        shell: bash
        run: |
          set -o pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/atf-release-qa/http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/build-info.json > /dev/null && break; sleep 1; done
          export ATF_BASE_URL=http://127.0.0.1:4173
          export ATF_PLAYWRIGHT_MODULE="$RUNNER_TEMP/atf-browser/node_modules/playwright/index.mjs"
          export ATF_PLAYER_QA_OUTPUT="$RUNNER_TEMP/atf-release-qa/player"
          export ATF_CHROMIUM_EXECUTABLE="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          # Preserve every scenario's evidence even when another one fails.
          # pipefail plus the final exit keep any failed assertion blocking CI.
          status=0
          python scripts/qa-save-profiles-v144.py --output "$RUNNER_TEMP/atf-release-qa/profiles" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/profiles.log" || { status=1; echo '::error title=Browser QA::qa-save-profiles-v144.py failed; inspect its retained report.'; }
          python scripts/qa-xeno-trials-v145.py --output "$RUNNER_TEMP/atf-release-qa/trials" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/trials.log" || { status=1; echo '::error title=Browser QA::qa-xeno-trials-v145.py failed; inspect its retained report.'; }
          python scripts/qa-xeno-trials-signatures-v147.py --output "$RUNNER_TEMP/atf-release-qa/signatures" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/signatures.log" || { status=1; echo '::error title=Browser QA::qa-xeno-trials-signatures-v147.py failed; inspect its retained report.'; }
          python scripts/qa-xeno-trials-controls-v150.py --root dist --output "$RUNNER_TEMP/atf-release-qa/controls" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/controls.log" || { status=1; echo '::error title=Browser QA::qa-xeno-trials-controls-v150.py failed; inspect its retained report.'; }
          python scripts/qa-xeno-trials-grapple-v153.py --output "$RUNNER_TEMP/atf-release-qa/grapple" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/grapple.log" || { status=1; echo '::error title=Browser QA::qa-xeno-trials-grapple-v153.py failed; inspect its retained report.'; }
          python scripts/qa-xeno-trials-rig-v154.py --output "$RUNNER_TEMP/atf-release-qa/rigs" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/rigs.log" || { status=1; echo '::error title=Browser QA::qa-xeno-trials-rig-v154.py failed; inspect its retained report.'; }
          python scripts/qa-xeno-trials-sequences-v155.py --output "$RUNNER_TEMP/atf-release-qa/sequences" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/sequences.log" || { status=1; echo '::error title=Browser QA::qa-xeno-trials-sequences-v155.py failed; inspect its retained report.'; }
          python scripts/qa-xeno-trials-presentations-v156.py --output "$RUNNER_TEMP/atf-release-qa/presentations-v156" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/presentations-v156.log" || { status=1; echo '::error title=Browser QA::qa-xeno-trials-presentations-v156.py failed; inspect its retained report.'; }
          python scripts/qa-xeno-trials-restraint-v156.py --output "$RUNNER_TEMP/atf-release-qa/restraint-v156" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/restraint-v156.log" || { status=1; echo '::error title=Browser QA::qa-xeno-trials-restraint-v156.py failed; inspect its retained report.'; }
          python scripts/qa-forge-narrative-v156.py --output "$RUNNER_TEMP/atf-release-qa/forge-narrative-v156" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/forge-narrative-v156.log" || { status=1; echo '::error title=Browser QA::qa-forge-narrative-v156.py failed; inspect its retained report.'; }
          ATF_ANNEX_POPULATION_QA_OUTPUT="$RUNNER_TEMP/atf-release-qa/annexes-v156" node scripts/qa-hub-annex-population-v156.mjs 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/annexes-v156.log" || { status=1; echo '::error title=Browser QA::qa-hub-annex-population-v156.mjs failed; inspect its retained report.'; }
          python scripts/qa-forge-conditions-v157.py --output "$RUNNER_TEMP/atf-release-qa/forge-conditions-v157" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/forge-conditions-v157.log" || { status=1; echo '::error title=Browser QA::qa-forge-conditions-v157.py failed; inspect its retained report.'; }
          ATF_ANNEX_SERVICE_QA_OUTPUT="$RUNNER_TEMP/atf-release-qa/annex-service-v157" node scripts/qa-hub-annex-service-v157.mjs 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/annex-service-v157.log" || { status=1; echo '::error title=Browser QA::qa-hub-annex-service-v157.mjs failed; inspect its retained report.'; }
          ATF_COCOON_QA_OUTPUT="$RUNNER_TEMP/atf-release-qa/black-cocoon-presentation-v158" node scripts/qa-black-cocoon-browser-v158.mjs 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/black-cocoon-presentation-v158.log" || { status=1; echo '::error title=Browser QA::qa-black-cocoon-browser-v158.mjs failed; inspect its retained report.'; }
          python scripts/qa-npc-circulation-v158.py --output "$RUNNER_TEMP/atf-release-qa/npc-circulation-v158" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/npc-circulation-v158.log" || { status=1; echo '::error title=Browser QA::qa-npc-circulation-v158.py failed; inspect its retained report.'; }
          python scripts/qa-npc-annex-circulation-v159.py --output "$RUNNER_TEMP/atf-release-qa/npc-annex-circulation-v159" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/npc-annex-circulation-v159.log" || { status=1; echo '::error title=Browser QA::qa-npc-annex-circulation-v159.py failed; inspect its retained report.'; }
          python scripts/qa-forge-npcs-v158.py --output "$RUNNER_TEMP/atf-release-qa/forge-npcs-v158" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/forge-npcs-v158.log" || { status=1; echo '::error title=Browser QA::qa-forge-npcs-v158.py failed; inspect its retained report.'; }
          python scripts/qa-xeno-trials-capture-reception-v158.py --output "$RUNNER_TEMP/atf-release-qa/xeno-trials-capture-reception-v158" 2>&1 | tee "$RUNNER_TEMP/atf-release-qa/xeno-trials-capture-reception-v158.log" || { status=1; echo '::error title=Browser QA::qa-xeno-trials-capture-reception-v158.py failed; inspect its retained report.'; }
          exit "$status"
      - name: Retain results without distributing private documents
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-release-evidence
          retention-days: 7
          path: ${{ runner.temp }}/atf-release-qa
          if-no-files-found: error
