name: Apply reviewed Trials runtime patch once
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/apply-trials-pr9-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'darknigthmare/aliens-tantalus-frontier' && github.event.pull_request.number == 9 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/audit-hardening-v143'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
      - name: Verify immutable base and apply four reviewed runtime files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c49ad8423bb50e3b95518d949ed0b1e274ae31ca
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          payload = ''
          patch = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == 'be69bbf701933f3d500eee375f45057c3414cf5babdbc3e41cc3e2708c414b90'
          subprocess.run(['git', 'apply', '--index', '--whitespace=error'], input=patch, check=True)
          expected = {'src/xeno-trials-runtime-v96.js':'55ddd91c65a8078f717ed368f1f38b257b75df869429a2a102c4fe32df7972cb','src/xeno-trials-engine-v96.js':'70bee9860950005c0da529ad85b547c090717e87bf3e536247b7a1d588f30880','src/xeno-trials-ai-v119.js':'2865a8b0743da3034513520bfcce51256f1d9d333efb75a789142f293478145b','src/xeno-trials-ui-v96.js':'bed6915ff5d1ce0dfe413faf657b4b9100dbe2811c2c65bfac9c3cbb71953d20'}
          changed = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert set(changed) == set(expected)
          for path, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == digest, path
              subprocess.run(['node', '--check', path], check=True)
          PY
          git diff --cached --check
          git -c user.name=ChatGPT -c user.email=noreply@openai.com commit -m 'fix: enforce Trials input lifecycle and legal no-special AI offense'
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/fix/audit-hardening-v143
