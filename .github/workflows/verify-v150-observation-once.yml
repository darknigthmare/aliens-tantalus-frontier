name: Verify reviewed V150 observation fix once
on:
  pull_request:
    paths: ['.github/workflows/verify-v150-observation-once.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.number == 9 && github.repository == 'darknigthmare/aliens-tantalus-frontier' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/audit-hardening-v143'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE: 97a731841ff4ebe4f9dd2b8fc53ae21aa39783a8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restore and test exact patch; publish immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          from pathlib import Path
          root=Path.cwd();out=Path(os.environ['RUNNER_TEMP'])/'v150-observation';out.mkdir(exist_ok=True)
          workflow='.github/workflows/verify-v150-observation-once.yml'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_HEAD']
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==os.environ['BASE']
          assert subprocess.check_output(['git','diff','--name-only',os.environ['BASE'],'HEAD'],text=True).splitlines()==[workflow]
          api='https://api.github.com/repos/darknigthmare/aliens-tantalus-frontier/git/blobs'
          def request(key=None,value=None):
              data=None if value is None else json.dumps(value).encode()
              req=urllib.request.Request(api+('/'+key if key else ''),data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='GET' if value is None else 'POST')
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          def sha(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          value=request('2a475dfb68516ef47f906c5c82be6f2691c0b1ef');assert value['encoding']=='base64'
          compressed=base64.b64decode(value['content']);assert sha(compressed)==value['sha']
          assert len(compressed)==3804 and hashlib.sha256(compressed).hexdigest()=='51264784797a075b1fd35738b95e5a0f4716ac37e12f4675f152417352f983b6'
          raw=lzma.decompress(compressed,memlimit=256*1024*1024);assert len(raw)==9899
          bundle=json.loads(raw);allowed={'scripts/qa-player-browser-v124.mjs','scripts/verify-player-qa-observation-v150.mjs','package.json','scripts/verify-public-release-v86.mjs','docs/forge/xeno-trials/V150-CONTROLS.md'}
          assert bundle['base']==os.environ['BASE'] and bundle['baseTree']=='ad1f4ccab48a529a39da219c564dc38c88931285'
          assert set(bundle['manifest'])==allowed and set(bundle['originals'])==allowed
          for path,expected in bundle['originals'].items():
              p=root/path
              assert not p.exists() if expected is None else p.is_file() and sha(p.read_bytes())==expected,path
          patch=out/'reviewed.patch';patch.write_text(bundle['patch'])
          assert {line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()}==allowed
          subprocess.run(['git','apply','--check',str(patch)],check=True);subprocess.run(['git','apply',str(patch)],check=True)
          for path,expected in bundle['manifest'].items():
              b=(root/path).read_bytes();assert len(b)==expected['bytes'] and sha(b)==expected['sha'] and hashlib.sha256(b).hexdigest()==expected['sha256'],path
              p=out/'files'/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          subprocess.run(['git','rm',workflow],check=True);subprocess.run(['git','add','--',*sorted(allowed)],check=True);subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only',os.environ['BASE']],text=True).splitlines())==allowed
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          (out/'manifest.json').write_text(json.dumps(bundle['manifest'],indent=2)+'\n')
          with (out/'targeted-tests.log').open('w') as log:
              subprocess.run(['node','--test','scripts/verify-player-qa-observation-v150.mjs','scripts/verify-xeno-trials-controls-v150.mjs','scripts/verify-xeno-trials-feedback-v149.mjs','scripts/verify-xeno-trials-supers-v148.mjs','scripts/verify-xeno-trials-v145.mjs','scripts/verify-xeno-trials-plan-v146.mjs'],stdout=log,stderr=subprocess.STDOUT,check=True)
          subprocess.run(['node','--check','scripts/qa-player-browser-v124.mjs'],check=True)
          with (out/'source-check.log').open('w') as log:subprocess.run(['npm','run','check'],stdout=log,stderr=subprocess.STDOUT,check=True)
          for path,expected in bundle['manifest'].items():
              value=request(value={'content':base64.b64encode((root/path).read_bytes()).decode(),'encoding':'base64'});assert value['sha']==expected['sha'],path
          (out/'verified.json').write_text(json.dumps({'base':os.environ['BASE'],'stagingCommit':os.environ['EXPECTED_HEAD'],'tree':tree,'files':len(allowed),'targetedTests':179,'branchUpdated':False},indent=2)+'\n')
          print('Five verified immutable blobs; 179 targeted tests. Tree and branch publication reserved to connected tools.')
          PY
      - name: Preserve reviewed patch and tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v150-observation
          retention-days: 7
          path: ${{ runner.temp }}/v150-observation
          if-no-files-found: error
