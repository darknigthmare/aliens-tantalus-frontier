          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              for row in expected:
                  if row['batch'] != batch: continue
                  data = z.read(row['archivePath'])
                  assert len(data) == row['bytes'], row['path']
                  sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  assert sha == row['sha'], row['path']
                  if row.get('sha256'): assert hashlib.sha256(data).hexdigest() == row['sha256'], row['path']
                  files.append(dict(path=row['path'], sha=sha, bytes=len(data), mode='100644', content_base64=base64.b64encode(data).decode('ascii')))
          payload = json.dumps(dict(batch=batch, files=files), separators=(',', ':')).encode('utf-8')
          packed = gzip.compress(payload, mtime=0)
          encoded = base64.b64encode(packed).decode('ascii')
          print('EARTH_RECOVERY_BEGIN ' + json.dumps(dict(batch=batch, files=len(files), rawBytes=len(payload), packedBytes=len(packed), sha256=hashlib.sha256(payload).hexdigest())))
          for offset in range(0, len(encoded), 6144):
              print('EARTH_RECOVERY_CHUNK %05d %s' % (offset // 6144, encoded[offset:offset+6144]))
          print('EARTH_RECOVERY_END ' + str(batch))
