name: Alien Earth DLC

on:
  pull_request:
    paths:
      - 'modules/alien-earth/**'
      - 'docs/development/alien-earth-v12/**'
      - 'scripts/*alien-earth*'
      - 'src/app.js'
      - 'src/title-screen-v61.js'
      - 'index.html'
      - 'package.json'
      - 'scripts/build.mjs'
      - 'scripts/dev.mjs'
      - 'scripts/verify-public-release-v86.mjs'
      - 'scripts/audit-native-qa-resources-v187.mjs'
      - '.github/workflows/alien-earth-dlc.yml'
  push:
    branches: [main]
    paths:
      - 'modules/alien-earth/**'
      - 'scripts/*alien-earth*'
      - 'src/app.js'
      - 'src/title-screen-v61.js'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/alien-earth-dlc.yml'

permissions:
  contents: read
concurrency:
  group: alien-earth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  earth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
            modules/alien-earth
            docs/development/alien-earth-v12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test Earth mechanics, lifecycle and host integration
        run: npm run test:dlc:earth
      - name: Verify exact host succession
        run: node --test scripts/verify-aliens1986-main-succession-v116.mjs scripts/verify-river-of-pain-succession.mjs
      - name: Build the scoped public Earth module
        env:
          ATF_BUILD_OUTPUT: '${{ runner.temp }}/earth-public'
        run: node scripts/build-alien-earth-dlc.mjs
      - name: Build the portable edition and public ZIP
        run: |
          node scripts/build-alien-earth-dlc.mjs --standalone --output="$RUNNER_TEMP/earth-export/JOUER_ALIEN_EARTH_V12.html"
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          work = Path(os.environ['RUNNER_TEMP'])
          shutil.make_archive(str(work / 'earth-export/ALIEN_EARTH_V12_MODULE_PUBLIC'), 'zip', work / 'earth-public', 'dlc/alien-earth/v12')
          PY
      - name: Prepare browser verification
        run: |
          python3 -m venv "$RUNNER_TEMP/earth-playwright"
          "$RUNNER_TEMP/earth-playwright/bin/pip" install playwright==1.62.0
          "$RUNNER_TEMP/earth-playwright/bin/python" -m playwright install --with-deps chromium
      - name: Traverse doors, save, reload and inspect the mobile UI
        run: |
          ATF_CHROMIUM_EXECUTABLE="$("$RUNNER_TEMP/earth-playwright/bin/python" -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export ATF_CHROMIUM_EXECUTABLE
          "$RUNNER_TEMP/earth-playwright/bin/python" -B scripts/qa-alien-earth-integration-v12.py \
            --root "$RUNNER_TEMP/earth-public" --source-root . \
            --output "$RUNNER_TEMP/earth-evidence" --skip-title \
            --standalone "$RUNNER_TEMP/earth-export/JOUER_ALIEN_EARTH_V12.html"
      - name: Preserve Earth browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alien-earth-v12-evidence
          path: '${{ runner.temp }}/earth-evidence'
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve playable Earth downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alien-earth-v12-playable
          path: '${{ runner.temp }}/earth-export'
          if-no-files-found: error
          retention-days: 30

  host-roundtrips:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies for the complete host
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/earth-host-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/earth-host-evidence/source-commit.txt"
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/earth-host-evidence/dependencies.log"
      - name: Build the complete native distribution
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/earth-host-evidence/build.log"
          cp dist/build-info.json "$RUNNER_TEMP/earth-host-evidence/"
      - name: Prepare the same browser for host verification
        run: |
          python3 -m venv "$RUNNER_TEMP/earth-host-playwright"
          "$RUNNER_TEMP/earth-host-playwright/bin/pip" install playwright==1.62.0
          "$RUNNER_TEMP/earth-host-playwright/bin/python" -m playwright install --with-deps chromium
      - name: Verify two host round trips on the real distribution
        shell: bash
        env:
          DEBUG: 'pw:browser'
        run: |
          set -o pipefail
          ATF_CHROMIUM_EXECUTABLE="$("$RUNNER_TEMP/earth-host-playwright/bin/python" -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export ATF_CHROMIUM_EXECUTABLE
          "$RUNNER_TEMP/earth-host-playwright/bin/python" -B scripts/qa-alien-earth-integration-v12.py \
            --root dist --source-root . --output "$RUNNER_TEMP/earth-host-evidence" \
            --scenario host-roundtrips --trace-mode light --expected-raster-count 15 \
            2>&1 | tee "$RUNNER_TEMP/earth-host-evidence/browser.log"
      - name: Preserve host round-trip evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alien-earth-v12-host-roundtrips
          path: '${{ runner.temp }}/earth-host-evidence'
          if-no-files-found: ignore
          retention-days: 7
