name: Import reviewed Fiorina local archive

on:
  push:
    branches:
      - integrate/fiorina-v114-local-recovery
    paths:
      - .github/workflows/import-fiorina-local-20261125.yml

permissions:
  contents: write

concurrency:
  group: import-fiorina-local-20261125
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.ref == 'refs/heads/integrate/fiorina-v114-local-recovery' && startsWith(github.event.head_commit.message, 'chore(fiorina): bootstrap reviewed archive transfer')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCHIVE_URL: https://sb-1tbarbq2bkbo.vercel.run/fiorina-archive-checkpoint-20261125.tar.gz
      ARCHIVE_SHA256: b6021a20fb6c6e69cc08851099c3701325115a501ff3d05a16e61d6f40bcc028
      ARCHIVE_BYTES: '240408831'
      MANIFEST_SHA256: 933d2c3fd212315c8dbd689fdc2784d881eb7a4907e11f8e560361ee80d498e9
    steps:
      - name: Check out the triggering revision without game assets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          sparse-checkout: |
            archives
            scripts
          persist-credentials: true
      - name: Download reviewed public archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            --output "$RUNNER_TEMP/fiorina-recovery.tar.gz" "$ARCHIVE_URL"
      - name: Verify exact contents and restore only the reviewed files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path.cwd()
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fiorina-recovery.tar.gz'
          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as source:
                  for block in iter(lambda: source.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()
          assert archive.stat().st_size == int(os.environ['ARCHIVE_BYTES'])
          assert digest(archive) == os.environ['ARCHIVE_SHA256'], 'Unreviewed transfer bytes'
          prefix = 'archives/project-recovery-20261116/'
          fiorina = prefix + 'fiorina/'
          expected = {
              prefix + 'MANIFEST.json',
              'scripts/project-recovery-admission-20261116.mjs',
              'scripts/verify-project-recovery-admission-20261116.mjs',
              fiorina + 'README.md', fiorina + 'INVENTAIRE.json',
              fiorina + 'ALIENS_TANTALUS_DLC_ALIEN3_FIORINA_V101_DENSE_LEVEL_DESIGN_PRODUCTION_SAFE.zip',
              fiorina + 'ALIENS_TANTALUS_DLC_ALIEN3_FIORINA_V102_DECORS_ANCRES_PRODUCTION_SAFE.zip',
              fiorina + 'ALIENS_TANTALUS_DLC_ALIEN3_FIORINA_V103_PASSAGES_RESEAUX_PRODUCTION_SAFE.zip',
              fiorina + 'ALIEN3_FIORINA_V113_SEUILS_DE_FIORINA_SUR_V112.zip',
              fiorina + 'ALIEN3_FIORINA_V114_ATLAS_CONTINUITE_SUR_V113.zip',
          }
          for version in range(104, 115):
              expected.add(fiorina + 'evidence/ALIEN3_V' + str(version) + '_VERIFICATION_FINALE.json')
          for version in range(104, 113):
              basename = fiorina + 'evidence/RAPPORT_ILLUSTRE_V' + str(version)
              expected.add(basename + '.pdf')
              expected.add(basename + ('.html' if version < 106 else '(1).html'))
          assert len(expected) == 39
          with tarfile.open(archive, 'r:gz') as source:
              members = source.getmembers()
              assert len(members) == len(expected)
              assert {member.name for member in members} == expected, 'Unexpected transfer paths'
              for member in members:
                  assert member.isfile() and not member.issym() and not member.islnk()
                  parts = pathlib.PurePosixPath(member.name).parts
                  assert not member.name.startswith('/') and all(part not in ('', '.', '..') for part in parts)
                  destination = root.joinpath(*parts)
                  assert root in destination.resolve().parents
                  assert not destination.is_symlink()
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with source.extractfile(member) as incoming, destination.open('wb') as output:
                      while block := incoming.read(1024 * 1024):
                          output.write(block)
          manifest_path = root / (prefix + 'MANIFEST.json')
          assert digest(manifest_path) == os.environ['MANIFEST_SHA256']
          manifest = json.loads(manifest_path.read_text())
          assert manifest['archiveRoot'] == prefix.rstrip('/')
          assert len(manifest['files']) == 42
          for item in manifest['files']:
              path = root / item['path']
              assert path.is_file() and not path.is_symlink()
              assert path.stat().st_size == item['sizeBytes']
              assert digest(path) == item['sha256'], 'Changed archive member: ' + item['path']
          legacy = root / (prefix + 'predator/MANIFEST.json')
          assert digest(legacy) == 'e08ff5d1564bae543cf88f825c0cd8f041f9c91dc3664e66158af522bf4d6f06'
          paths_file = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fiorina-paths.list'
          paths_file.write_bytes(b''.join(path.encode() + b'\0' for path in sorted(expected)))
          print('Verified: 39 transferred files; 42 exact archive members including unchanged Predator history.')
          PY
      - name: Commit and push only the recovered archives and admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git add --pathspec-from-file="$RUNNER_TEMP/fiorina-paths.list" --pathspec-file-nul
          python3 - <<'PY'
          import os, pathlib, subprocess
          expected = set((pathlib.Path(os.environ['RUNNER_TEMP']) / 'fiorina-paths.list').read_bytes().split(b'\0')) - {b''}
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).split(b'\0')) - {b''}
          assert staged == expected, 'Staged paths differ from the reviewed transfer'
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(fiorina): preserve V88-V114 local sources and evidence'
          git push origin HEAD:refs/heads/integrate/fiorina-v114-local-recovery
          git rev-parse HEAD
