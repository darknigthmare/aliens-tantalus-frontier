name: Import reviewed Fiorina native integration
on:
  push:
    branches:
      - integrate/fiorina-v114-local-recovery
    paths:
      - .github/workflows/import-fiorina-local-20261125.yml
permissions:
  contents: write
concurrency:
  group: import-fiorina-local-20261125
  cancel-in-progress: false
jobs:
  import:
    if: >-
      github.ref == 'refs/heads/integrate/fiorina-v114-local-recovery' && startsWith(github.event.head_commit.message, 'chore(fiorina): bootstrap reviewed native integration')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRANSFER_URL: https://sb-1tbarbq2bkbo.vercel.run/fiorina-native-integration-20261125.tar.gz
      TRANSFER_SHA256: 2453bdbb0065c4f900dcffbccc330e77bc6d9895f4d214c49dcacc698a0d1d0f
      RECEIPT_URL: https://sb-1tbarbq2bkbo.vercel.run/native-publication-receipt.json
      RECEIPT_SHA256: c96d7d7c31abfcd0e56d717d58d3a409e01ea1e8eec42ef9dd812c8813f8beaf
    steps:
      - name: Check out the triggering revision without game assets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            scripts
            docs
            archives
            .github
          persist-credentials: true
      - name: Download reviewed native files and receipt
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 "$TRANSFER_URL" --output "$RUNNER_TEMP/fiorina-native.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 60 "$RECEIPT_URL" --output "$RUNNER_TEMP/fiorina-native-receipt.json"
      - name: Verify exact contents and restore only the reviewed files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          archive = temporary / 'fiorina-native.tar.gz'
          receipt_path = temporary / 'fiorina-native-receipt.json'
          def digest(path):
              hasher = hashlib.sha256()
              with path.open('rb') as source:
                  while block := source.read(1024 * 1024):
                      hasher.update(block)
              return hasher.hexdigest()
          assert archive.stat().st_size == 474810
          assert digest(archive) == os.environ['TRANSFER_SHA256']
          assert receipt_path.stat().st_size == 15067
          assert digest(receipt_path) == os.environ['RECEIPT_SHA256']
          receipt = json.loads(receipt_path.read_text())
          assert receipt['files'] == 93 and receipt['size'] == 474810
          assert receipt['sha256'] == os.environ['TRANSFER_SHA256']
          expected = set(json.loads("[\"docs/development/FIORINA_GITHUB_INTEGRATION_V114.md\",\"index.html\",\"package.json\",\"scripts/qa-fiorina-native-v114.mjs\",\"scripts/verify-fiorina-production-v114.mjs\",\"scripts/verify-public-release-v86.mjs\",\"src/alien3-art-v102.js\",\"src/alien3-art-v103.js\",\"src/alien3-art-v104.js\",\"src/alien3-art-v105.js\",\"src/alien3-art-v106.js\",\"src/alien3-art-v107.js\",\"src/alien3-art-v108.js\",\"src/alien3-art-v109.js\",\"src/alien3-art-v110.js\",\"src/alien3-art-v111.js\",\"src/alien3-art-v112.js\",\"src/alien3-art-v113.js\",\"src/alien3-art-v114.js\",\"src/alien3-audio-v105.js\",\"src/alien3-diversion-v108.js\",\"src/alien3-dlc-runtime-v100.js\",\"src/alien3-dlc-runtime-v101.js\",\"src/alien3-dlc-runtime-v102.js\",\"src/alien3-dlc-runtime-v103.js\",\"src/alien3-dlc-runtime-v104.js\",\"src/alien3-dlc-runtime-v105.js\",\"src/alien3-dlc-runtime-v106.js\",\"src/alien3-dlc-runtime-v107.js\",\"src/alien3-dlc-runtime-v108.js\",\"src/alien3-dlc-runtime-v109.js\",\"src/alien3-dlc-runtime-v110.js\",\"src/alien3-dlc-runtime-v111.js\",\"src/alien3-dlc-runtime-v112.js\",\"src/alien3-dlc-runtime-v113.js\",\"src/alien3-dlc-runtime-v114.js\",\"src/alien3-dlc-runtime-v88.js\",\"src/alien3-dlc-runtime-v89.js\",\"src/alien3-dlc-runtime-v90.js\",\"src/alien3-dlc-runtime-v91.js\",\"src/alien3-dlc-runtime-v92.js\",\"src/alien3-dlc-runtime-v93.js\",\"src/alien3-dlc-runtime-v94.js\",\"src/alien3-dlc-runtime-v95.js\",\"src/alien3-dlc-runtime-v96.js\",\"src/alien3-dlc-runtime-v97.js\",\"src/alien3-dlc-runtime-v98.js\",\"src/alien3-dlc-runtime-v99.js\",\"src/alien3-dlc-v100.js\",\"src/alien3-dlc-v101.js\",\"src/alien3-dlc-v102.js\",\"src/alien3-dlc-v103.js\",\"src/alien3-dlc-v104.js\",\"src/alien3-dlc-v88.js\",\"src/alien3-dlc-v89.js\",\"src/alien3-dlc-v90.js\",\"src/alien3-dlc-v91.js\",\"src/alien3-dlc-v92.js\",\"src/alien3-dlc-v93.js\",\"src/alien3-dlc-v94.js\",\"src/alien3-dlc-v95.js\",\"src/alien3-dlc-v96.js\",\"src/alien3-dlc-v97.js\",\"src/alien3-dlc-v98.js\",\"src/alien3-dlc-v99.js\",\"src/alien3-encounter-v105.js\",\"src/alien3-fidelity-v113.js\",\"src/alien3-fidelity-v114.js\",\"src/alien3-navigation-v105.js\",\"src/alien3-operations-v107.js\",\"src/alien3-production-v114.js\",\"src/alien3-pursuit-v105.js\",\"src/alien3-pursuit-v106.js\",\"src/alien3-pursuit-v109.js\",\"src/alien3-routing-v111.js\",\"src/alien3-save-v107.js\",\"src/alien3-save-v108.js\",\"src/alien3-save-v109.js\",\"src/alien3-save-v110.js\",\"src/alien3-save-v111.js\",\"src/alien3-save-v112.js\",\"src/alien3-senses-v106.js\",\"src/alien3-spacing-v112.js\",\"src/alien3-steam-v109.js\",\"src/alien3-traffic-v110.js\",\"src/alien3-world-v114.js\",\"src/app.js\",\"src/content.js\",\"src/fiorina-campaign-v114.js\",\"src/game-production-runtime.js\",\"src/mission-levels-v52.js\",\"src/special-operations-v131.js\",\"sw.js\"]"))
          assert len(expected) == 93
          entries = {entry['path']: entry for entry in receipt['entries']}
          assert len(receipt['entries']) == 93 and set(entries) == expected
          with tarfile.open(archive, 'r:gz') as source:
              members = source.getmembers()
              assert len(members) == len(expected)
              assert {member.name for member in members} == expected, 'Unexpected transfer paths'
              for member in members:
                  assert member.isfile() and not member.issym() and not member.islnk()
                  parts = pathlib.PurePosixPath(member.name).parts
                  assert not member.name.startswith('/') and all(part not in ('', '.', '..') for part in parts)
                  assert parts[0] != '.github', 'Workflow files must be published through the reviewed API commit'
                  destination = root.joinpath(*parts)
                  assert root in destination.resolve().parents
                  assert not destination.is_symlink()
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with source.extractfile(member) as incoming, destination.open('wb') as output:
                      while block := incoming.read(1024 * 1024):
                          output.write(block)
                  entry = entries[member.name]
                  assert destination.stat().st_size == entry['size']
                  assert digest(destination) == entry['sha256'], 'Changed native source: ' + member.name
          paths_file = temporary / 'fiorina-native-paths.list'
          paths_file.write_bytes(b''.join(path.encode() + b'\0' for path in sorted(expected)))
          print('Verified: 93 exact native source, documentation and verification files.')
          PY
      - name: Commit and push only the reviewed native files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git add --pathspec-from-file="$RUNNER_TEMP/fiorina-native-paths.list" --pathspec-file-nul
          python3 - <<'PY'
          import os, pathlib, subprocess
          expected = set((pathlib.Path(os.environ['RUNNER_TEMP']) / 'fiorina-native-paths.list').read_bytes().split(b'\0')) - {b''}
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).split(b'\0')) - {b''}
          assert staged == expected, 'Staged paths differ from the reviewed transfer'
          PY
          # Preserve reviewed source bytes; the native workflow runs integration gates.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(fiorina): integrate native V114 campaign and recovered source stack'
          git push origin HEAD:refs/heads/integrate/fiorina-v114-local-recovery
          git rev-parse HEAD
