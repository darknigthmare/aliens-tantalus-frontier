name: Assemble reviewed Trials V149 once
on:
  pull_request:
    paths: ['.github/workflows/assemble-trials-v149-once.yml']
permissions:
  contents: read
jobs:
  assemble:
    if: github.event.pull_request.number == 9 && github.repository == 'darknigthmare/aliens-tantalus-frontier' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/audit-hardening-v143'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE: ca578e74970b3033a693a03a8a8ada00c8773c83
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restore exact reviewed files on the reconciled branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, base64, hashlib, lzma, subprocess, urllib.request
          from pathlib import Path
          root=Path.cwd(); out=Path(os.environ['RUNNER_TEMP'])/'v149-assembled'; out.mkdir(exist_ok=True)
          workflow='.github/workflows/assemble-trials-v149-once.yml'
          base=os.environ['BASE']; design='bc6241b4e775b02e3459f5f8cf95efad93de7545'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['EXPECTED_HEAD']
          assert git('rev-parse','HEAD^')==base
          assert git('rev-parse',base+'^')==design
          assert git('diff','--name-only',base,'HEAD').splitlines()==[workflow]
          # Preserve the concurrent, reviewed four-pixel CSS fix. The final CSS
          # strengthens it to five pixels and adds explicit native meter colors.
          css='xeno-trials-fullscreen-v119.css'
          assert git('diff','--name-only',design,base).splitlines()==[css]
          assert git('rev-parse',base+':'+css)=='b81ebd1c29accbbaff982dcac05cd6746546bafd'
          api='https://api.github.com/repos/darknigthmare/aliens-tantalus-frontier'
          def sha(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def read_blob(key):
              req=urllib.request.Request(api+'/git/blobs/'+key,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=60) as response: value=json.load(response)
              assert value['encoding']=='base64'
              data=base64.b64decode(value['content'])
              assert value['sha']==key and sha(data)==key
              return data
          keys=['1c382a6052e9847b603d9ce23eb30bbdf6d47ab4','40a0f7ab77c6e12703c4077563b1502054d7ab37','705473a3c9823e20ac33b1d595f99966bec39c14','8ca66b10e690a803011970fb72c4c14bee9a8cc7']
          compressed=b''.join(read_blob(key) for key in keys)
          assert len(compressed)==47896
          assert hashlib.sha256(compressed).hexdigest()=='c9709b8dad7bd0e0ce0831a879d416eb3a372a87ea09bfaa450a7bc33336b63f'
          raw=lzma.decompress(compressed,memlimit=256*1024*1024)
          assert len(raw)==198291
          bundle=json.loads(raw); manifest=bundle['manifest']
          assert bundle['base']==design and bundle['baseTree']=='6b0cac0cf9628c3109a2ebbacd3b50553ee6b47d'
          allowed={'package.json','scripts/qa-xeno-trials-signatures-v147.py','scripts/verify-public-release-v86.mjs','scripts/verify-xeno-trials-feedback-v149.mjs','src/xeno-trials-ai-v119.js','src/xeno-trials-runtime-v96.js','src/xeno-trials-stage-motion-v147.js',css,'docs/forge/xeno-trials/V149-FEEDBACK.md','docs/forge/xeno-trials/progress-v149.json','docs/forge/xeno-trials/XENO_TRIALS_SUIVI_V149.xlsx'}
          assert set(manifest)==allowed
          for path,item in manifest.items():
              before='b81ebd1c29accbbaff982dcac05cd6746546bafd' if path==css else item['before']
              if before is not None: assert git('rev-parse',base+':'+path)==before,path
              else: assert not (root/path).exists(),path
          text=bundle['patch']
          original='-.xt-super-meter-v148{height:4px;width:100%;accent-color:#ddbf69}'
          reconciled='-.xt-match-hud .xt-super-meter-v148{height:4px;min-height:4px;width:100%;accent-color:#ddbf69}'
          assert text.count(original)==1
          text=text.replace(original,reconciled)
          patch=out/'reviewed.patch'; patch.write_text(text,encoding='utf-8')
          names={line.split('\t',2)[2] for line in git('apply','--numstat',str(patch)).splitlines()}
          assert names==allowed
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for path,item in manifest.items():
              data=(root/path).read_bytes()
              assert len(data)==item['bytes'] and sha(data)==item['sha'] and hashlib.sha256(data).hexdigest()==item['sha256'],path
              dest=out/'files'/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          subprocess.run(['git','rm',workflow],check=True)
          subprocess.run(['git','add','--',*sorted(manifest)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(git('diff','--cached','--name-only',base).splitlines())==allowed
          (out/'local-tree.txt').write_text(git('write-tree')+'\n')
          print('All eleven files match their reviewed hashes; concurrent HUD correction reconciled.')
          PY
      - name: Test supers, trajectories, stage phases, lifecycle and planning
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/verify-xeno-trials-feedback-v149.mjs scripts/verify-xeno-trials-supers-v148.mjs scripts/verify-xeno-trials-signatures-v147.mjs scripts/verify-xeno-trials-v145.mjs scripts/verify-xeno-trials-plan-v146.mjs 2>&1 | tee "$RUNNER_TEMP/v149-assembled/targeted-tests.log"
          npm run check 2>&1 | tee "$RUNNER_TEMP/v149-assembled/source-check.log"
      - name: Create verified immutable Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,base64,hashlib,urllib.request
          from pathlib import Path
          root=Path.cwd();out=Path(os.environ['RUNNER_TEMP'])/'v149-assembled'
          manifest=json.loads((out/'manifest.json').read_text())
          api='https://api.github.com/repos/darknigthmare/aliens-tantalus-frontier'
          def post(path,value):
              assert path in ['/git/blobs','/git/trees']
              req=urllib.request.Request(api+path,data=json.dumps(value).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          elements=[]
          for path,item in manifest.items():
              data=(root/path).read_bytes()
              assert hashlib.sha256(data).hexdigest()==item['sha256']
              created=post('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert created['sha']==item['sha'],path
              elements.append({'path':path,'mode':'100644','type':'blob','sha':created['sha']})
          tree=post('/git/trees',{'base_tree':'38d8cd5e2fae49b36e79ee25b4f5ea16995393cc','tree':elements})
          assert tree['sha']==(out/'local-tree.txt').read_text().strip()
          (out/'assembled-tree.json').write_text(json.dumps({'base':os.environ['BASE'],'designBase':'bc6241b4e775b02e3459f5f8cf95efad93de7545','stagingCommit':os.environ['EXPECTED_HEAD'],'tree':tree['sha'],'files':len(manifest),'branchUpdated':False},indent=2)+'\n')
          print('Immutable tree '+tree['sha']+' verified; no branch update performed.')
          PY
      - name: Retain reviewed files and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v149-assembled
          retention-days: 7
          path: ${{ runner.temp }}/v149-assembled
          if-no-files-found: error
