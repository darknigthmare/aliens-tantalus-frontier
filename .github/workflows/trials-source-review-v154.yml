name: Trials source-art review
on:
  pull_request:
    paths:
      - '.github/workflows/trials-source-review-v154.yml'
      - 'src/xeno-trials-rig-v154.js'
      - 'src/xeno-trials-rig-data-v154.js'
      - 'src/xeno-trials-restraint-pose-v156.js'
      - 'scripts/verify-xeno-trials-restraint-pose-v156.mjs'
      - 'scripts/verify-xeno-trials-rig-v154.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            assets/user/castes-v87
            assets/openai/sprites/static-game-v106
            assets/openai/sprites/static-game-v118
      - name: Preserve the four native admitted images without changing pixels
        env:
          OUTPUT: ${{ runner.temp }}/trials-source-art
        run: |
          python3 - <<'PY'
          import os, struct, json, hashlib, shutil, subprocess
          from pathlib import Path
          paths = ['assets/user/castes-v87/game_afe_prowler.png', 'assets/openai/sprites/static-game-v106/game-dd-wy-commando.png', 'assets/openai/sprites/static-game-v106/game-dd-guardian.png', 'assets/openai/sprites/static-game-v118/darwin-era-cultist.png']
          output = Path(os.environ['OUTPUT']); output.mkdir()
          manifest = {'commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'images': []}
          for path in paths:
              data = Path(path).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) in [(1536,1024), (1024,1536)]
              manifest['images'].append({'path': path, 'width': width, 'height': height, 'sha256': hashlib.sha256(data).hexdigest()})
              shutil.copyfile(path, output/Path(path).name)
          (output/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trials-source-art
          path: ${{ runner.temp }}/trials-source-art
          retention-days: 7
          if-no-files-found: error
