name: Gameplay continuation V162
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gameplay-v162-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  continuation-v162:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native gameplay contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/atf-gameplay-v162"
          git rev-parse HEAD | tee "$RUNNER_TEMP/atf-gameplay-v162/source-commit.txt"
          node --test scripts/verify-harpoon-unload-v162.mjs scripts/verify-audio-lifecycle-v162.mjs scripts/verify-npc-medical-route-v162.mjs scripts/verify-campaign-convoy-history-v162.mjs scripts/verify-weapon-actions-v131.mjs 2>&1 | tee "$RUNNER_TEMP/atf-gameplay-v162/node.log"
      - name: Guard and build the distribution
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/atf-gameplay-v162/source-check.log"
          npm run build 2>&1 | tee "$RUNNER_TEMP/atf-gameplay-v162/build.log"
          npm run check:built 2>&1 | tee "$RUNNER_TEMP/atf-gameplay-v162/distribution-check.log"
      - name: Browser tooling outside the release
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Native Harpoon, audio, medical route and convoy history
        shell: bash
        run: |
          set -o pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/atf-gameplay-v162/http.log" 2>&1 &
          gameplay_server=$!
          trap 'kill "$gameplay_server"' EXIT
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/build-info.json > /dev/null && break; sleep 1; done
          export ATF_BASE_URL=http://127.0.0.1:4173
          export ATF_CHROMIUM_EXECUTABLE="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          status=0
          python scripts/qa-harpoon-native-v162.py --base "$ATF_BASE_URL" --output "$RUNNER_TEMP/atf-gameplay-v162/harpoon" 2>&1 | tee "$RUNNER_TEMP/atf-gameplay-v162/harpoon.log" || { status=1; echo '::error title=Browser QA::qa-harpoon-native-v162.py failed; inspect its retained report.'; }
          python scripts/qa-audio-native-v162.py --base "$ATF_BASE_URL" --output "$RUNNER_TEMP/atf-gameplay-v162/audio" 2>&1 | tee "$RUNNER_TEMP/atf-gameplay-v162/audio.log" || { status=1; echo '::error title=Browser QA::qa-audio-native-v162.py failed; inspect its retained report.'; }
          python scripts/qa-npc-medical-route-v162.py --base "$ATF_BASE_URL" --comparison-stage after --output "$RUNNER_TEMP/atf-gameplay-v162/medical" 2>&1 | tee "$RUNNER_TEMP/atf-gameplay-v162/medical.log" || { status=1; echo '::error title=Browser QA::qa-npc-medical-route-v162.py failed; inspect its retained report.'; }
          python scripts/qa-campaign-convoy-history-v162.py --base "$ATF_BASE_URL" --output "$RUNNER_TEMP/atf-gameplay-v162/convoy-history" 2>&1 | tee "$RUNNER_TEMP/atf-gameplay-v162/convoy-history.log" || { status=1; echo '::error title=Browser QA::qa-campaign-convoy-history-v162.py failed; inspect its retained report.'; }
          exit "$status"
      - name: Retain gameplay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gameplay-continuation-v162
          retention-days: 7
          path: ${{ runner.temp }}/atf-gameplay-v162
          if-no-files-found: error
