name: Publish reviewed Xeno Trials plan once
on:
  pull_request:
    paths:
      - '.github/xt146-transfer/**'
      - '.github/workflows/apply-xt146-plan-once.yml'
permissions:
  contents: read
jobs:
  publish:
    if: github.event.pull_request.number == 9 && github.repository == 'darknigthmare/aliens-tantalus-frontier' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/audit-hardening-v143'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE: 39bc11e5abe4427ae44c452e9727288e63310ec3
      BRANCH: fix/audit-hardening-v143
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
            docs
            .github
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify immutable source base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --filter=blob:none --depth=1 origin "$BASE"
          python3 - <<'PYVERIFY'
          import os, subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE'],'HEAD'],text=True).splitlines())
          expected={f'.github/xt146-transfer/p{i}.txt' for i in range(5)}|{'.github/workflows/apply-xt146-plan-once.yml'}
          assert changed==expected,sorted(changed)
          PYVERIFY
      - name: Restore exact reviewed workbook and plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYRESTORE'
          import base64, hashlib, html, io, json, lzma, os, re, subprocess, zipfile
          from pathlib import Path
          root=Path.cwd()
          work=Path(os.environ['RUNNER_TEMP'])/'xt146'
          work.mkdir(exist_ok=True)
          part_sha=['550e20f37d2bb271c264bf70e24f98ba41751182','051bc9ce0185e0f5ec956083dbd6a685b8cb5158','11b052a1488cd2d75ca9e5ed1260516481abc3e3','0d07a3aa872f1cee7214b1a5c7fa9d923ea7f882','c75ee64460a89afcb5e1b66e033265f14aaa41b7']
          def blob_sha(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          parts=[]
          for i,expected in enumerate(part_sha):
              b=(root/f'.github/xt146-transfer/p{i}.txt').read_bytes()
              assert blob_sha(b)==expected,(i,'transfer mismatch')
              if i==2:
                  # Correct one identified transcription error in the transfer text.
                  # Both the original and restored chunk hashes are pinned.
                  bad=b'GxLtuZXJ ndziEhdh'
                  assert b.count(bad)==1
                  b=b.replace(bad,bytes.fromhex('47784c74755a584a4e647a6945686468'))
                  assert blob_sha(b)=='066c95ff7ce9705239c4d4461b53ba1e958d74c6'
              parts.append(b)
          compressed=base64.b64decode(b''.join(parts),validate=True)
          assert len(compressed)==43428
          assert hashlib.sha256(compressed).hexdigest()=='0c70a7bff3c097300844954918fc56f6caba8d2da012c69050d1df4744b3afc2'
          raw=lzma.decompress(compressed,memlimit=256*1024*1024)
          assert len(raw)==535813
          bundle=json.loads(raw)
          allowed={'package.json','scripts/verify-xeno-trials-workbook-v146.py','scripts/verify-xeno-trials-plan-v146.mjs','docs/forge/xeno-trials/manifest-v146.json','docs/forge/xeno-trials/xeno-trials-plan-v146.json','docs/forge/xeno-trials/ALIENS_TANTALUS_XENO_TRIALS_PLAN_V146.xlsx','docs/forge/xeno-trials/README.md'}
          assert set(bundle['expectedFiles'])==allowed
          assert set(bundle['files'])==allowed-{'docs/forge/xeno-trials/xeno-trials-plan-v146.json','docs/forge/xeno-trials/ALIENS_TANTALUS_XENO_TRIALS_PLAN_V146.xlsx'}
          (work/'make_data.py').write_text(bundle['generator'],encoding='utf-8')
          env=dict(os.environ,XT146_WORK=str(work))
          js="""import fs from 'node:fs';
          import * as d from './src/xeno-trials-data-v96.js';
          import * as e from './src/xeno-trials-engine-v96.js';
          import * as s from './src/synth-combat-v110.js';
          import {getXenoTrialsPhysicalScaleV119} from './src/xeno-trials-physical-scale-v119.js';
          const fighters=d.XENO_TRIALS_FIGHTERS_V96.map(f=>({...f,art:d.getXenoTrialsArtV96(f.id),scale:getXenoTrialsPhysicalScaleV119(f.id)}));
          fs.writeFileSync(process.env.XT146_WORK+'/runtime.json',JSON.stringify({baseSha:'39bc11e5abe4427ae44c452e9727288e63310ec3',fighters,stages:d.XENO_TRIALS_STAGES_V96,controls:d.XENO_TRIALS_CONTROLS_V96,engineExports:Object.keys(e),synthExports:Object.keys(s)},null,2));"""
          subprocess.run(['node','--input-type=module','-e',js],env=env,check=True)
          subprocess.run(['python3',str(work/'make_data.py')],env=env,check=True)
          plan_bytes=(work/'xeno-trials-plan-v146.json').read_bytes()
          plan=json.loads(plan_bytes)
          # Lossless restoration of the artifact_tool-authored XLSX bytes.
          # No workbook cells, styles, formulas or caches are changed in this operation.
          transport=bundle['transport'];members={}
          for member in transport['members']:
              if 'literal' in member:
                  text=member['literal']
              else:
                  chunks=[]
                  for chunk in member['chunks']:
                      if isinstance(chunk,str): chunks.append(chunk);continue
                      row=plan['tables'][member['sheet']]['rows'][chunk['row']-6]
                      text=transport['templates'][chunk['template']].replace('~XTROW~',str(chunk['row']))
                      text=re.sub(r'~XTVAL(\d+)~',lambda m:html.escape(str(row[int(m[1])]),quote=False),text)
                      chunks.append(text)
                  text=''.join(chunks)
              members[member['name']]=text.encode('utf-8')
          archive=io.BytesIO()
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name,data in sorted(members.items()):
                  info=zipfile.ZipInfo(name,date_time=(2026,10,16,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16
                  z.writestr(info,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          output={path:text.encode('utf-8') for path,text in bundle['files'].items()}
          output['docs/forge/xeno-trials/xeno-trials-plan-v146.json']=plan_bytes
          output['docs/forge/xeno-trials/ALIENS_TANTALUS_XENO_TRIALS_PLAN_V146.xlsx']=archive.getvalue()
          assert set(output)==allowed
          for path,data in output.items():
              assert hashlib.sha256(data).hexdigest()==bundle['expectedFiles'][path],path
          for path,data in output.items():
              destination=root/path
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(data)

          from pathlib import Path
          root=Path.cwd()
          p=root/'scripts/verify-public-release-v86.mjs'
          s=p.read_text()
          anchor="const ROOT_IGNORES = new Set(['.git', 'dist', 'node_modules', '.vercel']);"
          assert s.count(anchor)==1
          s=s.replace(anchor,"SCRIPT_FILES.add('verify-xeno-trials-plan-v146.mjs');\nSCRIPT_FILES.add('verify-xeno-trials-workbook-v146.py');\n"+anchor)
          anchor="  'docs', 'docs/forge', 'docs/forge/QA-V130.md', 'docs/forge/README-V130.md',"
          assert s.count(anchor)==1
          s=s.replace(anchor,"  'docs/forge/xeno-trials',\n  'docs/forge/xeno-trials/README.md',\n  'docs/forge/xeno-trials/manifest-v146.json',\n  'docs/forge/xeno-trials/xeno-trials-plan-v146.json',\n  'docs/forge/xeno-trials/ALIENS_TANTALUS_XENO_TRIALS_PLAN_V146.xlsx',\n"+anchor)
          p.write_text(s)
          p=root/'scripts/verify-xeno-trials-plan-v146.mjs'
          s=p.read_text()
          s+="""

          test('reviewed planning documents are admitted only in source, never in the game distribution', async () => {
            const { isPublicDistributionPathV86, isPublicDistributionTextV86 } = await import('./verify-public-release-v86.mjs');
            for (const name of ['README.md', 'manifest-v146.json', 'xeno-trials-plan-v146.json', manifest.workbook]) {
              const path = `docs/forge/xeno-trials/${name}`;
              assert.equal(isPublicDistributionPathV86(path), true, path);
              assert.equal(isPublicDistributionPathV86(path, { built: true }), false, path);
              if (!name.endsWith('.xlsx')) assert.equal(isPublicDistributionTextV86(read(name).toString('utf8')), true);
            }
            assert.equal(isPublicDistributionPathV86('docs/forge/xeno-trials', { directory: true }), true);
            assert.equal(isPublicDistributionPathV86('docs/forge/xeno-trials', { directory: true, built: true }), false);
            assert.equal(isPublicDistributionPathV86('docs/forge/xeno-trials/unreviewed.xlsx'), false);
          });
          """
          p.write_text(s)

          assert hashlib.sha256((root/'scripts/verify-public-release-v86.mjs').read_bytes()).hexdigest()=='124ad9874285ed76f545b30e1dde7d521ea7894e08d5c704ebf7023f0e1d9ee2'
          assert hashlib.sha256((root/'scripts/verify-xeno-trials-plan-v146.mjs').read_bytes()).hexdigest()=='62b344b8572fbe7ebdcc733d846c17f356227aa49ee24084527b380902508b6a'
          (work/'reviewed-files.json').write_text(json.dumps({str(p):hashlib.sha256((root/p).read_bytes()).hexdigest() for p in sorted(allowed|{'scripts/verify-public-release-v86.mjs'})},indent=2)+'\n')
          PYRESTORE
      - name: Verify all planning files and publish on PR9 only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm run test:trials:plan | tee "$RUNNER_TEMP/xt146/plan-tests.log"
          git rm .github/xt146-transfer/p{0,1,2,3,4}.txt .github/workflows/apply-xt146-plan-once.yml
          git add package.json scripts/verify-public-release-v86.mjs scripts/verify-xeno-trials-plan-v146.mjs scripts/verify-xeno-trials-workbook-v146.py docs/forge/xeno-trials
          git diff --cached --check
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git commit -m "docs: publish reviewed Xeno Trials Excel plan for all 189 fighters"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD | tee "$RUNNER_TEMP/xt146/published-commit.txt"
      - name: Preserve reviewed workbook and validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xt146-plan-published
          retention-days: 7
          path: |
            docs/forge/xeno-trials
            ${{ runner.temp }}/xt146/reviewed-files.json
            ${{ runner.temp }}/xt146/plan-tests.log
            ${{ runner.temp }}/xt146/published-commit.txt
          if-no-files-found: error
