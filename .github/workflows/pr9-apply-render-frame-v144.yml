name: Apply reviewed render evidence patch once
on:
  pull_request:
    paths: ['.github/workflows/pr9-apply-render-frame-v144.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.number == 9 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/audit-hardening-v143'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          sparse-checkout: |
            src
            scripts
            .github
      - name: Apply reviewed bytes only to the unchanged PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c902151ac9c8b858b8b7f71bb96321ee0bc76db3
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/pr9-apply-render-frame-v144.yml
          test "$(git ls-remote origin refs/heads/fix/audit-hardening-v143 | cut -f1)" = "$(git rev-parse HEAD)"
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess,os
          encoded=''
          encoded=encoded.replace('fDIJIJIUET','fDIJIUET')
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='5c0f388c5da54fa1db87b17ac1de8417ffc1d733ce621af143bd0c8fd45eaf2b'
          file=pathlib.Path(os.environ['RUNNER_TEMP'])/'reviewed-render.patch';file.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(file)],check=True)
          subprocess.run(['git','apply',str(file)],check=True)
          expected={'scripts/qa-player-browser-v124.mjs':'4e0f11931a59efcc46a1c73454f533923e3d22ade8fda1b46ea1f52a4104862d','scripts/verify-audit-v143.mjs':'753f8c286305c5fa8c8b94f7b4bdf1444ea467809b8b9e491da893252630f672','src/player-weapon-runtime-v125.js':'8442bc58d623455a41209800ecf0f566c44fdb94ff0e7d611426743f6a7366ce'}
          for name,digest in expected.items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          subprocess.run(['git','add','--',*expected],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(expected)
          PY
          git diff --cached --check
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git commit -m 'test: synchronize muzzle-flash evidence with the actual rendered shot'
          git push origin HEAD:refs/heads/fix/audit-hardening-v143
