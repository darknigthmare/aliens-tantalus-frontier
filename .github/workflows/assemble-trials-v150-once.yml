name: Assemble reviewed Trials V150 once
on:
  pull_request:
    paths: ['.github/workflows/assemble-trials-v150-once.yml']
permissions:
  contents: read
jobs:
  assemble:
    if: github.event.pull_request.number == 9 && github.repository == 'darknigthmare/aliens-tantalus-frontier' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/audit-hardening-v143'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE: ebc018785add5916cc1e894d53c63ffd58f304d9
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restore exact reviewed files without updating a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, os, subprocess, urllib.request, zipfile
          from pathlib import Path
          root=Path.cwd(); out=Path(os.environ['RUNNER_TEMP'])/'v150-assembled'; out.mkdir(exist_ok=True)
          workflow='.github/workflows/assemble-trials-v150-once.yml'
          base=os.environ['BASE']; base_tree='739986420f6fd3b8f9f94d93bf44f738667e7606'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_HEAD']
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==base
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()==[workflow]
          api='https://api.github.com/repos/darknigthmare/aliens-tantalus-frontier'
          def request(path,value=None):
              assert path.startswith('/git/blobs') or path=='/git/trees'
              data=None if value is None else json.dumps(value).encode()
              req=urllib.request.Request(api+path,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='GET' if value is None else 'POST')
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          def sha(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def read_blob(key):
              value=request('/git/blobs/'+key); assert value['encoding']=='base64'
              data=base64.b64decode(value['content']); assert value['sha']==key and sha(data)==key
              return data
          first=read_blob('50de7a50444f4d21260adcb2312b92c846f7ad00')
          second=read_blob('acb6536f394991898ee4c0c52da3248c6176b1e4')
          # Reverse one identified transfer transcription. Both the received
          # and recovered raw chunk hashes are pinned; no source edits here.
          text=base64.b64encode(second).decode()
          bad='VZyHaKyVCV+yKlHToe'; good='VZyHaKyCV+yKlHToe'
          assert text.count(bad)==1
          text=text.replace(bad,good).rstrip('='); text+='='*((-len(text))%4)
          second=base64.b64decode(text,validate=True)
          assert sha(second)=='04c243ffdeef6c4e11f87ad74c9afb31810811e3'
          compressed=first+second
          assert len(compressed)==29788
          assert hashlib.sha256(compressed).hexdigest()=='521dacc0185070f05cb86db2044cf9f903fd04721da87e0eec02b23c39e203f4'
          payload=lzma.decompress(compressed,memlimit=256*1024*1024)
          assert len(payload)==256101
          bundle=json.loads(payload); manifest=bundle['manifest']
          assert bundle['base']==base and bundle['baseTree']==base_tree
          book='docs/forge/xeno-trials/XENO_TRIALS_SUIVI_V150.xlsx'
          allowed={'.github/workflows/full-release-v143.yml','src/xeno-trials-engine-v96.js','src/xeno-trials-runtime-v96.js','package.json','scripts/verify-public-release-v86.mjs','scripts/qa-player-browser-v124.mjs','scripts/qa-xeno-trials-controls-v150.py','scripts/verify-xeno-trials-controls-v150.mjs','docs/forge/xeno-trials/V150-CONTROLS.md','docs/forge/xeno-trials/progress-v150.json',book}
          assert set(manifest)==allowed and set(bundle['originals'])==allowed and bundle['book']==book
          for path,expected in bundle['originals'].items():
              current=root/path
              assert not current.exists() if expected is None else current.is_file() and sha(current.read_bytes())==expected,path
          patch=out/'reviewed.patch'; patch.write_text(bundle['patch'],encoding='utf-8')
          names={line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()}
          assert names==allowed-{book}
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          assert bundle['zipLevel']==0
          archive=io.BytesIO()
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_STORED) as z:
              for member in bundle['zipMembers']:
                  info=zipfile.ZipInfo(member['name'],tuple(member['date'])); info.create_system=3; info.external_attr=0o100644<<16
                  z.writestr(info,member['text'].encode('utf-8'),compress_type=zipfile.ZIP_STORED)
          (root/book).write_bytes(archive.getvalue())
          for path,expected in manifest.items():
              data=(root/path).read_bytes()
              assert len(data)==expected['bytes'] and sha(data)==expected['sha'] and hashlib.sha256(data).hexdigest()==expected['sha256'],path
              target=out/'files'/path; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          subprocess.run(['git','rm',workflow],check=True)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines())==allowed
          tree_sha=subprocess.check_output(['git','write-tree'],text=True).strip()
          elements=[]
          for path,expected in manifest.items():
              data=(root/path).read_bytes()
              created=request('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert created['sha']==expected['sha'],path
              elements.append({'path':path,'mode':'100644','type':'blob','sha':created['sha']})
          tree=request('/git/trees',{'base_tree':base_tree,'tree':elements})
          assert tree['sha']==tree_sha
          (out/'assembled-tree.json').write_text(json.dumps({'base':base,'stagingCommit':os.environ['EXPECTED_HEAD'],'tree':tree_sha,'files':len(manifest),'branchUpdated':False},indent=2)+'\n')
          print('Verified eleven reviewed files and immutable tree '+tree_sha+'; no branch update performed.')
          PY
      - name: Verify controls, feedback, supers, lifecycle and plan with full media
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/verify-xeno-trials-controls-v150.mjs scripts/verify-xeno-trials-feedback-v149.mjs scripts/verify-xeno-trials-supers-v148.mjs scripts/verify-xeno-trials-v145.mjs scripts/verify-xeno-trials-plan-v146.mjs 2>&1 | tee "$RUNNER_TEMP/v150-assembled/targeted-tests.log"
          node --check scripts/qa-player-browser-v124.mjs
          npm run check 2>&1 | tee "$RUNNER_TEMP/v150-assembled/source-check.log"
      - name: Preserve reviewed files, immutable tree and tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v150-assembled
          retention-days: 7
          path: ${{ runner.temp }}/v150-assembled
          if-no-files-found: error
